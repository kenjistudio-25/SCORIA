<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengaturan Ujian &amp; Pengawas — Scoria</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --text:#0f2233;--muted:#4d6a80;--accent:#3d9be0;--green:#1f9d3a;--orange:#c77700;--red:#d92d20;
  --glass:rgba(255,255,255,.72);--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.1);--bar:rgba(255,255,255,.6);--track:rgba(120,120,128,.16);
  --wall:linear-gradient(135deg,#97D7FF 0%,#c3e6ff 38%,#e3f3ff 70%,#fdf1d0 100%);
  --shadow:0 14px 40px rgba(30,30,80,.2),0 0 0 .5px rgba(0,0,0,.14);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--wall) fixed;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 20px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;min-width:0}
.logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,#b9e5ff,#6fc2f6);color:#0b2a42;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.22)}
.logo img{width:100%;height:100%;object-fit:contain;background:#08141d}
.sname{display:block;min-width:0;line-height:1.2}
.sname b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname small{display:block;font-size:11px;font-weight:500;color:var(--muted)}

/* Layout */
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:16px}
h1{font-size:clamp(26px,4.5vw,36px);letter-spacing:-.025em;line-height:1.1}
.head p{color:var(--muted);font-size:14px;margin-top:4px}
.chip{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;background:var(--glass);box-shadow:0 0 0 .5px var(--line)}
.panel{background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:16px;box-shadow:var(--shadow)}
.box{padding:18px}
.ph{display:none}

/* Filter */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools input{font:inherit;color:var(--text);padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);min-width:0;width:100%}
.tools input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,166,230,.2)}
.tools .search{flex:1 1 260px}

/* Tabel */
.tw{overflow-x:auto;border-radius:14px;background:var(--card);box-shadow:0 0 0 .5px var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:11px 12px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:.5px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.nm{font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.tg{white-space:nowrap}
td.ac{white-space:nowrap}
.mini{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:9px;background:var(--track);margin-right:6px}
.mini:hover{background:rgba(120,120,128,.26)}
.mini.del{color:var(--red)}
.empty{padding:34px 14px;text-align:center;color:var(--muted);font-size:14px}
.err{color:var(--red)}
.upd{font-size:12px;color:var(--muted);margin-top:10px;text-align:right}

/* Modal */
.mbd{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,25,40,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mbd.show{display:flex}
.modal{width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);padding:20px}
.modal h2{font-size:20px;letter-spacing:-.01em;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fld input{width:100%;font:inherit;color:var(--text);padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff}
.fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,166,230,.2)}
.fmsg{min-height:20px;font-size:13px;color:var(--red);margin-bottom:6px}
.macts{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.bt{padding:11px 18px;border-radius:12px;font-weight:700;background:var(--track)}
.bt.pri{background:linear-gradient(160deg,#38bdf8,#0369a1);color:#fff}
.bt:disabled{opacity:.6;cursor:default}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.dock nav{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px;border-radius:34px;background:rgba(255,255,255,.55);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);box-shadow:var(--shadow)}
.d{display:grid;place-items:center;border-radius:15px;transition:transform .2s;position:relative}
.d:hover{transform:translateY(-6px) scale(1.1)}
.d:active{transform:scale(.94)}
.d .ic{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.d .ic svg{width:28px;height:28px}
.d[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px);padding:6px 11px;border-radius:8px;background:#000;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s,transform .15s}
@media (hover:hover){.d[data-tip]:hover::after{opacity:1;visibility:visible;transform:translate(-50%,0)}}
.d:focus-visible::after{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* HP: tabel jadi kartu */
@media (max-width:720px){
  .nav{padding:8px 8px;padding-top:calc(8px + env(safe-area-inset-top))}
  .wrap{padding:14px 8px}
  .box{padding:10px}
  .sname small{display:none}
  .tw{background:none;box-shadow:none;overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{margin-bottom:10px;padding:10px 12px;border-radius:14px;background:var(--card);box-shadow:0 0 0 .5px var(--line)}
  td{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border:0;text-align:right}
  td::before{content:attr(data-l);flex:none;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding-top:2px}
  td.nm{font-size:15px}
  td.ac{justify-content:flex-end}
  td.ac::before{display:none}
  .d .ic{width:50px;height:50px;border-radius:14px}
  .d .ic svg{width:25px;height:25px}
  .dock nav{gap:10px;padding:9px 12px}
}

/* Cetak jadwal */
@media print{
  @page{size:A4 landscape;margin:14mm}
  body{background:#fff!important;padding:0;color:#000}
  .nav,.dock,.tools,.upd,.head,.mbd,.chip{display:none!important}
  .wrap{max-width:none;padding:0}
  .panel{background:none;box-shadow:none;backdrop-filter:none;border-radius:0}
  .box{padding:0}
  .ph{display:block;text-align:center;margin-bottom:14px}
  .ph b{display:block;font-size:18px;text-transform:uppercase}
  .ph span{display:block;font-size:14px}
  .tw{overflow:visible;box-shadow:none;background:none;border-radius:0}
  table{font-size:12px;border:1px solid #000}
  th,td{border:1px solid #000;color:#000;background:none;padding:6px 8px}
  th.ac,td.ac{display:none!important}
  tr{break-inside:avoid}
}
</style>
</head>
<body>

<header class="nav">
  <div class="brand">
    <span class="logo" id="logo" aria-hidden="true">S</span>
    <span class="sname"><b id="navTitle">Scoria</b><small>Pengaturan Ujian &amp; Pengawas</small></span>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <div>
      <h1>Jadwal Ujian &amp; Pengawas</h1>
      <p>Daftar jadwal ujian beserta pengawas ruangnya.</p>
    </div>
    <span class="chip" id="chipTotal">0 jadwal</span>
  </div>

  <section class="panel box" aria-label="Daftar ujian">
    <div class="ph"><b id="phSekolah">Scoria</b><span>Jadwal Ujian &amp; Pengawas Ruang</span></div>
    <div class="tools">
      <div class="search"><input id="fQ" type="search" placeholder="Cari mata pelajaran, pengawas, NIP, atau kelas…" aria-label="Cari jadwal"></div>
    </div>
    <div id="list"><div class="empty">Memuat…</div></div>
    <p class="upd" id="upd"></p>
  </section>
</main>

<!-- Modal tambah/ubah ujian -->
<div class="mbd" id="mbd">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Tambah Ujian</h2>
    <p class="sub">Isi jadwal ujian dan pengawas ruangnya.</p>
    <div>
      <label class="fld"><span>Hari / Tanggal</span><input id="fTgl" type="date" required></label>
      <label class="fld"><span>Mata Pelajaran</span><input id="fMapel" type="text" maxlength="120" autocomplete="off" required></label>
      <label class="fld"><span>Nama Pengawas</span><input id="fNama" type="text" maxlength="120" autocomplete="off" required></label>
      <label class="fld"><span>NIP</span><input id="fNip" type="text" inputmode="numeric" maxlength="30" autocomplete="off" placeholder="Kosongkan bila tidak ada"></label>
      <label class="fld"><span>Kelas</span><input id="fKelas" type="text" maxlength="60" list="dlKelas" autocomplete="off" required><datalist id="dlKelas"></datalist></label>
      <p class="fmsg" id="fMsg" role="alert"></p>
      <div class="macts">
        <button class="bt" id="mBatal" type="button">Batal</button>
        <button class="bt pri" id="mSimpan" type="button">Simpan</button>
      </div>
    </div>
  </div>
</div>

<div class="dock">
  <nav aria-label="Menu">
    <a class="d" data-tip="Beranda" aria-label="Beranda" href="adminsistem.html"><span class="ic" style="background:linear-gradient(160deg,#b9e5ff,#6fc2f6);color:#0b2a42"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7M6 10v10h12V10M10 20v-6h4v6"/></svg></span></a>
    <button class="d" id="bAdd" type="button" data-tip="+ Ujian" aria-label="Tambah Ujian"><span class="ic" style="background:linear-gradient(160deg,#4ade80,#15803d)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button class="d" id="bPrint" type="button" data-tip="Cetak Jadwal" aria-label="Cetak Jadwal"><span class="ic" style="background:linear-gradient(160deg,#fbbf24,#b45309)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 14h10v6H7z"/></svg></span></button>
    <button class="d" id="bReset" type="button" data-tip="Reset Ujian" aria-label="Reset Ujian"><span class="ic" style="background:linear-gradient(160deg,#f87171,#b91c1c)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span></button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var SB_URL='https://vvlngdwghdhrrnpczier.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2bG5nZHdnaGRocnJucGN6aWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDI1MzgsImV4cCI6MjEwNzk3ODUzOH0.kV3y6rUu0NKbV451dvD4SkeZRJtuLNzwoA81tUY8jiA';
  var TBL='jadwal_ujian';
  var db=window.supabase.createClient(SB_URL,SB_KEY);
  var $=function(i){return document.getElementById(i);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var rows=[],loadErr='',editId=null,lastFocus=null,saving=false;

  function fmtTgl(s){
    var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(!m)return s||'-';
    return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  }
  function errText(e){
    var m=(e&&e.message)||String(e);
    if(/does not exist|schema cache|Could not find the table/i.test(m))return 'Tabel jadwal_ujian belum ada di Supabase. Jalankan jadwal_ujian.sql di SQL Editor.';
    if(/permission denied/i.test(m))return 'Akses data ditolak. Periksa RLS dan grant tabel jadwal_ujian.';
    return m;
  }

  /* ---------- Navbar: nama sekolah & logo ---------- */
  async function loadProfil(){
    try{
      var r=await db.from('profil').select('nama_sekolah,logo_url').order('id',{ascending:true}).limit(1).maybeSingle();
      if(r.error||!r.data)return;
      if(r.data.nama_sekolah){$('navTitle').textContent=r.data.nama_sekolah;$('phSekolah').textContent=r.data.nama_sekolah;}
      if(r.data.logo_url){var im=new Image();im.alt='';im.onload=function(){$('logo').textContent='';$('logo').appendChild(im);};im.src=r.data.logo_url;}
    }catch(_){}
  }
  /* Saran nama kelas (opsional, diabaikan bila kolom tidak ada) */
  async function loadKelas(){
    var cols=['rombel','kelas'];
    for(var i=0;i<cols.length;i++){
      try{
        var r=await db.from('siswa').select(cols[i]).range(0,1999);
        if(r.error||!r.data)continue;
        var set={};r.data.forEach(function(x){if(x[cols[i]])set[x[cols[i]]]=1;});
        var ks=Object.keys(set).sort(function(a,b){return a.localeCompare(b,'id',{numeric:true});});
        if(ks.length){$('dlKelas').innerHTML=ks.map(function(k){return '<option value="'+esc(k)+'">';}).join('');return;}
      }catch(_){}
    }
  }

  /* ---------- Data ---------- */
  async function load(){
    try{
      var r=await db.from(TBL).select('*').order('tanggal',{ascending:true}).order('id',{ascending:true}).range(0,999);
      if(r.error)throw r.error;
      rows=r.data||[];loadErr='';
      $('upd').textContent='Diperbarui '+new Date().toLocaleTimeString('id-ID');
    }catch(e){loadErr=errText(e);}
    render();
  }
  function filtered(){
    var q=$('fQ').value.trim().toLowerCase();
    if(!q)return rows;
    return rows.filter(function(r){
      return [r.mata_pelajaran,r.nama_pengawas,r.nip,r.kelas,fmtTgl(r.tanggal)].join(' ').toLowerCase().indexOf(q)>=0;
    });
  }
  function render(){
    var el=$('list'),list=filtered();
    $('chipTotal').textContent=rows.length+' jadwal';
    if(loadErr){el.innerHTML='<div class="empty err">'+esc(loadErr)+'</div>';return;}
    if(!list.length){el.innerHTML='<div class="empty">'+(rows.length?'Tidak ada jadwal yang cocok dengan pencarian.':'Belum ada jadwal ujian. Tekan tombol + Ujian untuk menambahkan.')+'</div>';return;}
    el.innerHTML='<div class="tw"><table><thead><tr><th class="num">No</th><th>Hari / Tanggal</th><th>Mata Pelajaran</th><th>Nama Pengawas</th><th>NIP</th><th>Kelas</th><th class="ac">Aksi</th></tr></thead><tbody>'+
      list.map(function(r,i){
        return '<tr><td class="num" data-l="No">'+(i+1)+'</td><td class="tg" data-l="Hari / Tanggal">'+esc(fmtTgl(r.tanggal))+'</td><td class="nm" data-l="Mata Pelajaran">'+esc(r.mata_pelajaran)+'</td><td data-l="Pengawas">'+esc(r.nama_pengawas)+'</td><td data-l="NIP">'+(esc(r.nip)||'-')+'</td><td data-l="Kelas">'+esc(r.kelas)+'</td>'+
          '<td class="ac"><button class="mini" type="button" data-a="edit" data-id="'+esc(r.id)+'">Ubah</button><button class="mini del" type="button" data-a="del" data-id="'+esc(r.id)+'">Hapus</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  $('fQ').addEventListener('input',render);
  $('list').addEventListener('click',function(e){
    var b=e.target.closest('button[data-a]');if(!b)return;
    var r=rows.filter(function(x){return String(x.id)===b.dataset.id;})[0];if(!r)return;
    if(b.dataset.a==='edit')openModal(r);else delRow(r);
  });

  /* ---------- Modal ---------- */
  function openModal(r){
    editId=r?r.id:null;lastFocus=document.activeElement;
    $('mTitle').textContent=r?'Ubah Ujian':'Tambah Ujian';
    $('fTgl').value=r?String(r.tanggal).slice(0,10):'';
    $('fMapel').value=r?r.mata_pelajaran||'':'';
    $('fNama').value=r?r.nama_pengawas||'':'';
    $('fNip').value=r?r.nip||'':'';
    $('fKelas').value=r?r.kelas||'':'';
    $('fMsg').textContent='';
    $('mbd').classList.add('show');
    setTimeout(function(){$('fTgl').focus();},30);
  }
  function closeModal(){
    $('mbd').classList.remove('show');
    if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(_){}
  }
  async function save(){
    if(saving)return;
    var p={tanggal:$('fTgl').value,mata_pelajaran:$('fMapel').value.trim(),nama_pengawas:$('fNama').value.trim(),nip:$('fNip').value.trim(),kelas:$('fKelas').value.trim()};
    if(!p.tanggal||!p.mata_pelajaran||!p.nama_pengawas||!p.kelas){$('fMsg').textContent='Tanggal, mata pelajaran, nama pengawas, dan kelas wajib diisi.';return;}
    saving=true;$('mSimpan').disabled=true;$('mSimpan').textContent='Menyimpan…';
    try{
      var r=editId?await db.from(TBL).update(p).eq('id',editId).select('id'):await db.from(TBL).insert(p).select('id');
      if(r.error)throw r.error;
      if(editId&&(!r.data||!r.data.length))throw new Error('Perubahan ditolak (cek policy update di Supabase).');
      closeModal();await load();
    }catch(e){$('fMsg').textContent=errText(e);}
    finally{saving=false;$('mSimpan').disabled=false;$('mSimpan').textContent='Simpan';}
  }
  async function delRow(r){
    if(!confirm('Hapus jadwal ini?\n'+fmtTgl(r.tanggal)+' · '+r.mata_pelajaran+' · '+r.kelas))return;
    try{
      var x=await db.from(TBL).delete().eq('id',r.id).select('id');
      if(x.error)throw x.error;
      if(!x.data||!x.data.length)throw new Error('Penghapusan ditolak (cek policy delete di Supabase).');
    }catch(e){alert('Gagal menghapus: '+errText(e));return;}
    load();
  }
  $('bAdd').addEventListener('click',function(){openModal(null);});
  $('mBatal').addEventListener('click',closeModal);
  $('mSimpan').addEventListener('click',save);
  $('mbd').addEventListener('mousedown',function(e){if(e.target===$('mbd'))closeModal();});
  document.addEventListener('keydown',function(e){
    if(!$('mbd').classList.contains('show'))return;
    if(e.key==='Escape')closeModal();
    else if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='search'){e.preventDefault();save();}
  });

  /* ---------- Cetak Jadwal ---------- */
  $('bPrint').addEventListener('click',function(){
    if(!rows.length){alert('Belum ada jadwal ujian untuk dicetak.');return;}
    if($('fQ').value){$('fQ').value='';render();}
    window.print();
  });

  /* ---------- Reset Ujian ---------- */
  $('bReset').addEventListener('click',async function(){
    if(!rows.length){alert('Daftar ujian sudah kosong.');return;}
    var t=prompt('Semua jadwal ujian ('+rows.length+' data) akan dihapus permanen dan tidak bisa dikembalikan.\n\nKetik RESET untuk melanjutkan:');
    if(t===null)return;
    if(t.trim()!=='RESET'){alert('Reset dibatalkan karena kata konfirmasi tidak cocok.');return;}
    try{
      var r=await db.rpc('reset_jadwal_ujian'); /* mengosongkan tabel & mengulang Id dari 1 */
      if(r.error){
        var f=await db.from(TBL).delete().gte('id',0).select('id'); /* cadangan bila fungsi SQL belum dibuat */
        if(f.error)throw f.error;
      }
    }catch(e){alert('Gagal mereset: '+errText(e));return;}
    load();
  });

  loadProfil();loadKelas();load();
})();
</script>
</body>
</html>
