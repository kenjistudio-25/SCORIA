<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kerjakan Asesmen — MADANI</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;--text:#0f2a1d;--muted:#58705f;--accent:#12a05f;--red:#d12f26;--line:rgba(0,0,0,.1);--card:rgba(255,255,255,.9);--track:rgba(120,120,128,.16);--wall:linear-gradient(135deg,#9fe3bf 0%,#c4eed6 38%,#e6f4c8 70%,#f7e8b0 100%);--g:linear-gradient(160deg,#2fd283,#0b7a47)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--wall) fixed;line-height:1.5;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(255,255,255,.7);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:.5px solid var(--line)}
.tt{flex:1;min-width:0;line-height:1.25}.tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt small{font-size:12px;color:var(--muted)}
.tm{font:800 18px ui-monospace,Menlo,monospace;padding:6px 14px;border-radius:99px;background:var(--g);color:#fff}.tm.warn{background:linear-gradient(160deg,#ff7a8a,#e11d48);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.6}}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;box-shadow:0 8px 28px rgba(20,60,40,.14),0 0 0 .5px var(--line);padding:18px}
.lay{display:grid;grid-template-columns:1fr 270px;gap:16px;align-items:start}
.idn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin-bottom:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.85);box-shadow:0 0 0 .5px var(--line)}.idn div{min-width:0}.idn small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.idn b{display:block;font-size:14px;overflow-wrap:anywhere}
.ins{margin-bottom:14px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.7);padding:10px 14px;border-radius:12px;box-shadow:0 0 0 .5px var(--line)}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--g)}
.pill,.sc{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}.pill{background:rgba(18,160,95,.14);color:#0b7a47}.sc{margin-left:auto;background:var(--track);color:var(--muted)}
.qimg{margin:0 0 16px;text-align:center}
.qimg img{display:block;margin:0 auto;max-width:100%;max-height:340px;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.qmed video,.qmed audio,.qmed iframe{display:block;width:100%;margin:0 0 16px}
.qmed video{max-height:360px;border-radius:12px;background:#000}
.qmed iframe{aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.qmed audio{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.85);box-shadow:0 0 0 .5px var(--line)}
.qpdf{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:14px 16px;border-radius:14px;background:rgba(209,47,38,.07);box-shadow:inset 0 0 0 1.5px rgba(209,47,38,.3);color:var(--text);text-decoration:none}
.qpdf:hover{background:rgba(209,47,38,.12)}
.qpdf .qi{font-size:30px;flex:none}
.qpdf b{display:block;font-size:15px;color:#b3261e}
.qpdf small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.qimg.err::after{content:'Gambar tidak dapat dimuat.';font-size:12.5px;color:var(--muted)}
.qt{font-size:16.5px;line-height:1.55;white-space:pre-wrap;margin-bottom:16px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);transition:.15s}
.op b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--track)}
.op:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}.op.on{background:rgba(18,160,95,.12);box-shadow:inset 0 0 0 2px var(--accent)}.op.on b{background:var(--accent);color:#fff}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bs .op{justify-content:center;font-weight:800;font-size:16px;padding:18px 10px;margin:0}
.cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{width:42px;height:48px;text-align:center;font:800 20px ui-monospace,Menlo,monospace;text-transform:uppercase;border-radius:10px;border:0;background:#fff;box-shadow:inset 0 0 0 2px var(--accent);color:#0b7a47}
.cell:focus{outline:none;background:rgba(18,160,95,.12);box-shadow:inset 0 0 0 3px var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}
textarea{width:100%;min-height:200px;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(18,160,95,.2)}
.nav h3{font-size:14px;margin-bottom:10px}.ng{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.nb{aspect-ratio:1;border-radius:9px;font-weight:700;font-size:13px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.nb.done{background:var(--accent);color:#fff;box-shadow:none}.nb.flag{background:#ff9f0a;color:#fff;box-shadow:none}.nb.cur{outline:3px solid #0f2a1d;outline-offset:1px}
.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--muted);margin:12px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.prog{font-size:13px;color:var(--muted);margin-bottom:10px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:10px;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:.5px solid var(--line)}
.bt{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;padding:11px 20px;border-radius:12px;background:var(--track)}
.bt.pri{color:#fff;background:var(--g);box-shadow:0 4px 12px rgba(11,122,71,.35)}.bt.on{background:#ff9f0a;color:#fff}.bt[disabled]{opacity:.5;pointer-events:none}.bt.full{width:100%}
.bt.dg{color:var(--red);background:rgba(209,47,38,.1);box-shadow:inset 0 0 0 1.5px rgba(209,47,38,.35)}
.cm{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,20,18,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cm.show{display:flex;animation:wmf .2s ease-out}
.cm .wb{max-width:420px}
.cm .ic{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:rgba(209,47,38,.12)}
.cm h2{color:var(--red)}
.cm .vc{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--track);color:var(--muted)}
.cm .bt{margin-top:10px}.cm .bt.pri{margin-top:18px}
body.ac #qc .qt,body.ac #qc .op span{-webkit-user-select:none;user-select:none}
.st{text-align:center;padding:40px 16px}.st h2{margin-bottom:6px}.st p{color:var(--muted)}.st .bt{margin-top:16px}
.big{font-size:56px;font-weight:800;color:#0b7a47;line-height:1.1;margin:10px 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;max-width:92vw;padding:10px 18px;border-radius:14px;font-size:13.5px;font-weight:600;color:#fff;background:#1d1d1fe6;opacity:0;pointer-events:none;transition:opacity .25s}.toast.show{opacity:1}
@media (max-width:820px){.lay{grid-template-columns:1fr}.wrap{padding:10px 8px}.ng{grid-template-columns:repeat(8,1fr)}.cell{width:36px;height:44px}}
/* Popup peringatan sisa waktu 1 menit */
.wm{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(15,42,29,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.wm.show{display:flex;animation:wmf .2s ease-out}
.wb{width:100%;max-width:380px;text-align:center;padding:26px 22px 20px;border-radius:22px;background:#fff;box-shadow:0 24px 60px rgba(20,60,40,.35),0 0 0 .5px var(--line);animation:wmp .35s cubic-bezier(.2,1.3,.4,1)}
.wr{position:relative;width:112px;height:112px;margin:0 auto 14px}
.wr svg{width:100%;height:100%;transform:rotate(-90deg)}
.wr circle{fill:none;stroke-width:8}
.wr .t{stroke:var(--track)}
.wr .p{stroke:var(--red);stroke-linecap:round;stroke-dasharray:301.6;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.wr b{position:absolute;inset:0;display:grid;place-items:center;font:800 34px ui-monospace,Menlo,monospace;color:var(--red)}
.wb h2{font-size:19px;line-height:1.3;margin-bottom:6px}
.wb p{font-size:14px;color:var(--muted)}
.wb .bt{margin-top:18px}
@keyframes wmf{from{opacity:0}}
@keyframes wmp{from{opacity:0;transform:scale(.86) translateY(10px)}}
@media (prefers-reduced-motion:reduce){.wm.show,.wb{animation:none}.wr .p{transition:none}.pf.up .sp{animation:none}}
/* Praktikum: unggah foto / video sebagai jawaban */
.prz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;padding:20px 14px;border-radius:14px;border:2px dashed var(--accent);background:rgba(18,160,95,.06);color:#0b7a47;font-weight:800;font-size:15px;text-align:center}
.prz small{font-weight:500;color:var(--muted);font-size:12.5px}
.prz:hover{background:rgba(18,160,95,.12)}
.prz[disabled]{opacity:.5;pointer-events:none}
.pfl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.pf{position:relative;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 0 0 .5px var(--line),0 2px 8px rgba(20,60,40,.1)}
.pf img,.pf video{display:block;width:100%;height:120px;object-fit:cover;background:#000}
.pf .pi{padding:6px 8px;font-size:11.5px;color:var(--muted);line-height:1.3}
.pf .pi b{display:block;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pf .rm{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center}
.pf.up{display:grid;place-items:center;min-height:170px;text-align:center;padding:10px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.pf.up .sp{width:26px;height:26px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--accent);animation:spn .8s linear infinite;margin:0 auto 8px}
.pf.er{box-shadow:inset 0 0 0 2px var(--red)}.pf.er .bt{margin-top:8px;padding:6px 14px;font-size:12.5px}
@keyframes spn{to{transform:rotate(360deg)}}
/* ===== AXAM LOCK MODE ===== */
body.locked{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.locked textarea,body.locked .cell{-webkit-user-select:text;user-select:text}
.lk{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,24,17,.97)}
.lk.show{display:flex}
.lb{width:100%;max-width:400px;text-align:center;padding:26px 22px 22px;border-radius:22px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.lb .li{font-size:44px;line-height:1}.lb h2{font-size:20px;margin:8px 0 6px}.lb p{font-size:14px;color:var(--muted)}.lb .lc{margin-top:10px;font-weight:700;color:var(--red)}.lb .bt{margin-top:18px}
.gate{max-width:480px;margin:6vh auto 0}.gate .gi{font-size:48px;line-height:1}.gate .gl{text-align:left;margin:16px 0 0 18px;font-size:14px;color:var(--text)}.gate .gl li{margin-bottom:6px}
@media print{body{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="tt"><b id="hT">Asesmen</b><small id="hS"></small></div><div class="tm" id="tm" hidden>--:--</div></header>
<main class="wrap" id="app"><div class="card st"><p>Memuat…</p></div></main>
<div class="wm" id="wm" role="alertdialog" aria-modal="true" aria-labelledby="wmT" aria-describedby="wmD"><div class="wb">
<div class="wr"><svg viewBox="0 0 112 112" aria-hidden="true"><circle class="t" cx="56" cy="56" r="48"/><circle class="p" id="wmP" cx="56" cy="56" r="48"/></svg><b id="wmN">60</b></div>
<h2 id="wmT">Waktu Anda tinggal 1 Menit Lagi</h2>
<p id="wmD">Pastikan Anda menyelesaikan Tes sebelum waktu berakhir. Jawaban dikirim otomatis saat waktu habis.</p>
<button class="bt pri full" id="wmB" type="button">Lanjut Mengerjakan</button></div></div>
<div class="lk" id="lk" role="alertdialog" aria-modal="true" aria-labelledby="lkT" aria-describedby="lkR"><div class="lb"><div class="li">⚠️</div><h2 id="lkT">AXAM LOCK MODE</h2><p id="lkR"></p><p class="lc" id="lkC"></p><button class="bt pri full" id="lkB" type="button">Kembali ke Ujian</button></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const SHOW_NILAI=true; /* false = sembunyikan nilai dari siswa setelah selesai */
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=k=>String(k||'').toLowerCase().replace(/[\s\-_.]/g,'');
const letters=s=>String(s||'').toUpperCase().replace(/[^A-Z]/g,'');
const app=$('app');
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3500);}
function msg(t,m,btn,href){app.innerHTML='<div class="card st"><h2>'+esc(t)+'</h2><p>'+esc(m)+'</p>'+(btn?'<a class="bt pri" href="'+href+'">'+esc(btn)+'</a>':'')+'</div>';}

const db=window.supabase.createClient('https://vvlngdwghdhrrnpczier.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2bG5nZHdnaGRocnJucGN6aWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDI1MzgsImV4cCI6MjEwNzk3ODUzOH0.kV3y6rUu0NKbV451dvD4SkeZRJtuLNzwoA81tUY8jiA');
const BACK='asesmen.html';
const DESK={pg:'Pilihlah satu jawaban yang paling benar (A, B, C, atau D). Bacalah setiap pertanyaan dengan teliti.',bs:'Tentukan apakah setiap pernyataan Benar atau Salah.',essay:'Jawablah setiap pertanyaan dengan uraian yang jelas dan menggunakan bahasa sendiri.',tts:'Isilah kotak jawaban sesuai petunjuk mendatar dan menurun. Satu kotak diisi satu huruf.',praktikum:'Kerjakan rangkaian praktik sesuai langkah pada soal, lalu unggah foto atau video hasil praktikmu sebagai jawaban.'};

let sess=null,ses=null;
try{sess=JSON.parse(sessionStorage.getItem('madani_session')||'null');ses=JSON.parse(sessionStorage.getItem('madani_asesmen')||'null');}catch(_){}
const pid=+new URLSearchParams(location.search).get('paket');
const KAT={UH:'Ulangan Harian',UTS:'UTS',UAS:'UAS'};
const katLabel=p=>{const ke=+p.ke||1;return (KAT[p.kategori]||p.kategori||'')+(ke>1?' '+ke:'');};
let ID={nama:'',nisn:'',kelas:'',kategori:''};
let P,A,Q=[],st,KEY,deadline,timer,busy=false,finished=false,warned=false,wmPrev=null,wmTo=null,timeUp=false;

function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(_){}}
const answered=i=>{const a=st.ans[i];if(Array.isArray(a))return a.length>0;return a!==undefined&&a!==null&&(typeof a!=='string'||a.trim()!=='');};

async function init(){
  try{
    if(!sess||sess.role!=='siswa'||!sess.id)return msg('Belum login sebagai siswa','Silakan masuk lewat Ruang Siswa.','Ke halaman login','index.html');
    if(!pid||!ses||+ses.paket_id!==pid)return msg('Token belum dimasukkan','Mulai asesmen dari halaman Asesmen dan masukkan token dari gurumu.','Ke halaman Asesmen',BACK);
    const ra=await db.from('soal_aktif').select('*').eq('id',ses.soal_aktif_id).maybeSingle();
    if(ra.error)throw ra.error;A=ra.data;
    const now=Date.now();
    if(!A||A.paket_id!==pid||!A.aktif)return msg('Asesmen tidak aktif','Asesmen ini sudah dinonaktifkan oleh guru.','Kembali',BACK);
    if(now<new Date(A.mulai).getTime())return msg('Belum dimulai','Asesmen ini belum dibuka.','Kembali',BACK);
    const rp=await db.from('paket_soal').select('*').eq('id',pid).maybeSingle();
    if(rp.error)throw rp.error;P=rp.data;if(!P)return msg('Soal tidak ditemukan','Paket soal tidak tersedia.','Kembali',BACK);
    let kelas=sess.kelas||'',nama=sess.nama||'',nisn=sess.nisn||'';
    if(!kelas||!nama||!nisn){
      const s=await db.from('siswa').select('*').eq('id',sess.id).maybeSingle();
      const d=s.data||{};
      kelas=kelas||d.rombel||d.kelas||'';
      nama=nama||d.nama||d.nama_siswa||'';
      nisn=nisn||d.nisn||'';
    }
    ID={nama:nama,nisn:String(nisn||''),kelas:kelas||P.kelas,kategori:katLabel(P)};
    if(norm(kelas)!==norm(P.kelas))return msg('Bukan untuk kelasmu','Asesmen ini diperuntukkan bagi kelas '+P.kelas+'.','Kembali',BACK);
    const rh=await db.from('hasil_asesmen').select('nilai,skor_otomatis,skor_maks,perlu_koreksi').eq('soal_aktif_id',A.id).eq('siswa_id',String(sess.id)).maybeSingle();
    if(rh.data)return done(rh.data,true);
    if(now>new Date(A.selesai).getTime())return msg('Waktu habis','Asesmen ini sudah berakhir.','Kembali',BACK);
    const rb=await db.from('butir_soal').select('nomor,tipe,teks,gambar,skor,opsi,jawaban,arah').eq('paket_id',pid).order('nomor',{ascending:true}).range(0,999);
    if(rb.error)throw rb.error;Q=rb.data||[];
    if(!Q.length)return msg('Belum ada soal','Paket ini belum memiliki butir soal. Hubungi gurumu.','Kembali',BACK);

    KEY='madani_kerja_'+A.id+'_'+sess.id;
    try{st=JSON.parse(localStorage.getItem(KEY)||'null');}catch(_){}
    gate(!st,()=>{
      if(!st)st={mulai:Date.now(),ans:{},flag:{},cur:0,viol:0};
      deadline=Math.min(st.mulai+A.durasi_menit*60000,new Date(A.selesai).getTime());
      const was=st.lock;st.lock=true;save();start();lockStart();
      stopWatch();
      chkStop().then(()=>{if(was&&!stopped)violate('Halaman ditutup atau dimuat ulang',true);});
    });
  }catch(e){
    const m=(e&&e.message)||String(e);
    msg('Gagal memuat soal',/permission denied/i.test(m)?'Akses data ditolak. Hubungi guru.':m,'Kembali',BACK);
  }
}

function start(){
  $('hT').textContent=P.judul;$('hS').textContent=P.kelas+(P.materi?' · '+P.materi:'');
  Object.keys(st.ans).forEach(k=>{const v=st.ans[k];if(Array.isArray(v)&&v.some(x=>x&&x.local)){const r=v.filter(x=>!(x&&x.local));if(r.length)st.ans[k]=r;else delete st.ans[k];}});save();
  $('tm').hidden=false;
  app.innerHTML='<div class="idn"><div><small>Nama Siswa</small><b>'+esc(ID.nama||'-')+'</b></div><div><small>NISN</small><b>'+esc(ID.nisn||'-')+'</b></div><div><small>Kelas</small><b>'+esc(ID.kelas||'-')+'</b></div><div><small>Kategori Ulangan</small><b>'+esc(ID.kategori||'-')+'</b></div></div><div class="ins">'+esc(P.deskripsi||DESK[P.bentuk]||'')+'</div>'+
    '<div class="lay"><section class="card" id="qc"></section><aside class="card nav"><h3>Daftar Soal</h3><div class="prog" id="pg"></div><div class="ng" id="ng"></div>'+
    '<div class="lg"><span><i style="background:var(--accent)"></i>Terjawab</span><span><i style="background:#ff9f0a"></i>Ragu</span><span><i style="background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)"></i>Kosong</span></div>'+
    '<button class="bt pri full" id="bS" type="button">Kirim Jawaban</button></aside></div>'+

  $('bP').onclick=()=>go(st.cur-1);

  $('bF').onclick=()=>{st.flag[st.cur]=!st.flag[st.cur];save();upd();};
  $('bS').onclick=ask;$('wmB').onclick=hideWarn;document.addEventListener('keydown',e=>{if(e.key==='Escape')hideWarn();});
  $('ng').onclick=e=>{const b=e.target.closest('.nb');if(b)go(+b.dataset.i);};

  if(isPrak()){fPr=document.createElement('input');fPr.type='file';fPr.accept='image/*,video/*';fPr.multiple=true;fPr.hidden=true;document.body.appendChild(fPr);
  fPr.addEventListener('change',()=>{pickEnd();const fs=Array.from(fPr.files||[]);fPr.value='';prAdd(fs);});

/* ================= AXAM LOCK MODE =================
   Catatan: web/PWA tidak bisa mengunci perangkat. Modul ini memaksa layar penuh,
   mendeteksi pelanggaran (pindah tab/aplikasi, geser tutup layar, keluar layar penuh, tombol Kembali),
   mengunci tampilan dengan peringatan, lalu auto-kirim di pelanggaran ke-MAX. */
const LOCK={MAX:3,DELAY:4,GRACE:1500,BLUR_MS:900};
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
const fsCan=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const fsReq=()=>{const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;return f?Promise.resolve(f.call(e)):Promise.reject(new Error('nofs'));};
let lockOn=false,lockOpen=false,lockPause=false,lockFs=false,lockBound=false,lockOut=false,mediaFs=false;
let lockGrace=0,lockLast=0,lockWL=null,lockBlurT=null,lockRT=null;

async function wake(){
  if(!('wakeLock' in navigator)||lockWL)return;
  try{const w=await navigator.wakeLock.request('screen');lockWL=w;w.addEventListener('release',()=>{if(lockWL===w)lockWL=null;});}catch(_){}
}
async function lockEnter(){
  lockGrace=Date.now()+LOCK.GRACE;
  try{await fsReq();lockFs=true;}catch(_){}
  try{if(navigator.keyboard&&navigator.keyboard.lock)navigator.keyboard.lock(['Escape']).catch(()=>{});}catch(_){}
  await wake();
  lockGrace=Date.now()+LOCK.GRACE;
}
function lockOff(){
  lockOn=false;lockOpen=false;clearTimeout(lockBlurT);clearInterval(lockRT);
  $('lk').classList.remove('show');document.body.classList.remove('locked');
  try{if(lockWL)lockWL.release();}catch(_){}lockWL=null;
  try{if(navigator.keyboard&&navigator.keyboard.unlock)navigator.keyboard.unlock();}catch(_){}
  try{if(fsEl()){const x=document.exitFullscreen||document.webkitExitFullscreen;Promise.resolve(x.call(document)).catch(()=>{});}}catch(_){}
}
function lockStart(){
  lockOn=true;document.body.classList.add('locked');
  try{history.pushState(null,'',location.href);}catch(_){}
  lockBind();
}
function showLock(reason,soft){
  lockOpen=true;hideWarn();
  $('lkR').textContent=reason+'.';
  $('lkC').textContent=soft?'Tidak dihitung sebagai pelanggaran.':'Pelanggaran '+st.viol+' dari '+LOCK.MAX+'. Pada pelanggaran ke-'+LOCK.MAX+' jawabanmu dikirim otomatis dan ujian dikunci.';
  const b=$('lkB');let d=soft?0:LOCK.DELAY;
  const label=()=>{b.disabled=d>0;b.textContent=d>0?'Kembali ke Ujian ('+d+')':'Kembali ke Ujian';};
  label();clearInterval(lockRT);
  if(d>0)lockRT=setInterval(()=>{d--;label();if(d<=0)clearInterval(lockRT);},1000);
  $('lk').classList.add('show');
}
function violate(reason,quiet){
  if(!lockOn||finished||busy||lockPause||lockOpen||picking)return;
  const n=Date.now();
  if(!quiet&&(n<lockGrace||n-lockLast<LOCK.GRACE))return;
  lockLast=n;st.viol=(st.viol||0)+1;catatPelanggaran(reason,st.viol>=LOCK.MAX);save();
  if(st.viol>=LOCK.MAX){lockOut=true;toast('Batas pelanggaran tercapai. Jawaban dikirim otomatis.');submit();return;}
  if(quiet){toast(reason+'. Dicatat sebagai pelanggaran '+st.viol+' dari '+LOCK.MAX+'.');return;}
  showLock(reason,false);
}
/* ---------- Catat pelanggaran ke tabel ujian_berlangsung (kolom status & keterangan) ---------- */
const KET_MAP={'Kamu berpindah tab atau aplikasi':'Berpindah tab/aplikasi atau menggeser layar untuk menutup','Halaman ujian kehilangan fokus':'Halaman ujian kehilangan fokus (pindah jendela/aplikasi)','Kamu keluar dari layar penuh':'Keluar dari layar penuh','Kamu menekan tombol Kembali':'Menekan tombol Kembali','Mencoba mengambil screenshot':'Mencoba mengambil screenshot','Halaman ditutup atau dimuat ulang':'Halaman ditutup atau dimuat ulang'};
const ketOf=r=>KET_MAP[r]||r;
let ujP=Promise.resolve();
/* mode 'open' = hanya jika jam_selesai masih kosong (tidak menimpa penghentian pengawas); mode 'mg' = hanya jika status masih Mengerjakan */
function ujSync(patch,mode){
  if(!ses||!ses.ujian_id)return;
  ujP=ujP.then(()=>{
    let q=db.from('ujian_berlangsung').update(patch).eq('id',ses.ujian_id);
    if(mode==='open')q=q.is('jam_selesai',null);else if(mode==='mg')q=q.eq('status','Mengerjakan');
    return q;
  }).then(r=>{if(r&&r.error)console.warn('ujian_berlangsung:',r.error.message);}).catch(()=>{});
}
/* ---------- Pengawas menghentikan ujian (slider di pantauujian.html): siswa keluar paksa & jawaban dikirim otomatis ----------
   Penanda: status = Pelanggaran DAN jam_selesai terisi (pelanggaran otomatis siswa tidak pernah mengisi jam_selesai sebelum kirim). */
let stopped=false,stopKet='',stopT=null,stopBound=false;
async function chkStop(){
  if(stopped||finished||busy||!ses||!ses.ujian_id)return;
  try{
    const r=await db.from('ujian_berlangsung').select('status,keterangan,jam_selesai').eq('id',ses.ujian_id).maybeSingle();
    if(r.error||!r.data||stopped||finished||busy)return;
    if(r.data.status==='Pelanggaran'&&r.data.jam_selesai){
      stopped=true;stopKet=r.data.keterangan||'';clearInterval(stopT);
      toast('Ujian dihentikan oleh pengawas. Jawaban dikirim otomatis.');
      submit();
    }
  }catch(_){}
}
function stopWatch(){
  clearInterval(stopT);stopT=setInterval(chkStop,5000);
  if(!stopBound){stopBound=true;document.addEventListener('visibilitychange',()=>{if(!document.hidden)chkStop();});}
}
function catatPelanggaran(reason,kunci){
  st.ket=Array.isArray(st.ket)?st.ket:[];
  const d=new Date(),t=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  st.ket.push(ketOf(reason)+' ('+t+')');
  let k=st.ket.map((x,i)=>(i+1)+'. '+x).join('; ');
  if(kunci)k+='. Batas pelanggaran tercapai, ujian dikunci dan jawaban dikirim otomatis.';
  if(stopped)return;
  ujSync({status:'Pelanggaran',keterangan:k},'open');
}
function lockConfirm(m){
  lockPause=true;let r=false;
  try{r=confirm(m);}finally{lockGrace=Date.now()+LOCK.GRACE;lockPause=false;}
  if(!r&&lockOn&&lockFs&&!fsEl())showLock('Layar penuh perlu diaktifkan kembali',true);
  return r;
}
function gate(fresh,cb){
  $('tm').hidden=true;
  const prev=st&&st.viol?'<li>Pelanggaran sebelumnya: <b>'+st.viol+'</b> dari '+LOCK.MAX+'.</li>':'';
  app.innerHTML='<div class="card st gate"><div class="gi">🔒</div><h2>AXAM LOCK MODE</h2><p>'+(fresh?'Ujian berjalan dalam mode terkunci.':'Lanjutkan ujianmu. Waktu tetap berjalan sejak kamu mulai.')+'</p>'+
    '<ul class="gl"><li>'+(fsCan()?'Layar penuh akan diaktifkan.':'Perangkat ini tidak mendukung layar penuh. Buka lewat ikon aplikasi di Layar Utama (PWA) agar lebih aman.')+'</li>'+
    '<li>Jangan pindah tab/aplikasi, jangan geser layar untuk menutup, jangan keluar layar penuh, dan jangan tekan tombol Kembali.</li>'+
    '<li>Setiap pelanggaran dicatat dan dilihat oleh gurumu. Pelanggaran ke-'+LOCK.MAX+': ujian dikunci dan jawaban dikirim otomatis.</li>'+
    '<li>Waktu ujian tidak berhenti saat layar terkunci.</li>'+prev+'</ul>'+
    '<button class="bt pri full" id="gB" type="button" style="margin-top:18px">'+(fresh?'Mulai Ujian':'Lanjutkan Ujian')+'</button></div>';
  $('gB').onclick=async()=>{$('gB').disabled=true;await lockEnter();cb();};
}
function lockBind(){
  if(lockBound)return;lockBound=true;
  $('lkB').onclick=async()=>{await lockEnter();lockOpen=false;lockLast=Date.now();$('lk').classList.remove('show');};
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)violate('Kamu berpindah tab atau aplikasi');else wake();
  });
  window.addEventListener('blur',()=>{
    clearTimeout(lockBlurT);
    lockBlurT=setTimeout(()=>{
      const a=document.activeElement;
      if(a&&a.tagName==='IFRAME')return; /* fokus ke video YouTube/Drive di dalam soal */
      if(!document.hasFocus())violate('Halaman ujian kehilangan fokus');
    },LOCK.BLUR_MS);
  });
  window.addEventListener('focus',()=>clearTimeout(lockBlurT));
  const fsch=()=>{
    const e=fsEl();
    if(e&&e!==document.documentElement){mediaFs=true;return;} /* layar penuh milik video soal tidak dihitung */
    if(!e&&mediaFs){mediaFs=false;if(lockOn&&!finished&&!busy&&lockFs)showLock('Layar penuh perlu diaktifkan kembali',true);return;}
    if(lockOn&&lockFs&&!e)violate('Kamu keluar dari layar penuh');
  };
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,fsch));
  window.addEventListener('popstate',()=>{
    if(!lockOn)return;
    try{history.pushState(null,'',location.href);}catch(_){}
    violate('Kamu menekan tombol Kembali');
  });
  document.addEventListener('keydown',e=>{
    if(!lockOn)return;
    const k=String(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey;
    if(e.key==='F12'||(c&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(c&&(k==='u'||k==='s'||k==='p'))){e.preventDefault();toast('Tombol ini dinonaktifkan selama ujian.');}
  },true);
  document.addEventListener('keyup',e=>{
    if(lockOn&&e.key==='PrintScreen'){try{navigator.clipboard.writeText('');}catch(_){}violate('Mencoba mengambil screenshot');}
  });
  ['contextmenu','copy','cut','dragstart','paste'].forEach(ev=>document.addEventListener(ev,e=>{
    if(!lockOn)return;
    const t=e.target,edit=t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT');
    if(edit&&(ev==='copy'||ev==='cut'||ev==='paste'))return; /* kolom jawaban tetap boleh (paste TTS ditangani onPaste) */
    e.preventDefault();e.stopImmediatePropagation();
  },true));
}

function go(i){if(i<0||i>=Q.length)return;st.cur=i;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function lbl(q){return q.tipe==='praktikum'?'Praktikum':q.tipe==='pg'?'Pilihan Ganda':q.tipe==='bs'?'Benar / Salah':q.tipe==='tts'?(q.arah==='menurun'?'Menurun':'Mendatar'):'Uraian';}
let mediaIdx=-1;
const RX_VID=/\.(mp4|webm|mov|m4v|ogv|mkv)$/i,RX_AUD=/\.(mp3|m4a|wav|ogg|oga|aac|opus|flac)$/i,RX_IMG=/\.(jpe?g|png|gif|webp|svg|bmp|avif)$/i,RX_PDF=/\.pdf$/i;
function driveId(u){const m=String(u||'').match(/drive\.google\.com\/(?:file\/d\/|open\?(?:[^#]*&)?id=|uc\?(?:[^#]*&)?id=)([\w-]+)/i);return m?m[1]:'';}
function embedUrl(u){
  u=String(u||'');const m=u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/i);
  return m?'https://www.youtube.com/embed/'+m[1]+'?rel=0&playsinline=1':'';
}
function drivePreview(id){return 'https://drive.google.com/file/d/'+id+'/preview';}
function driveDirect(id){return 'https://drive.usercontent.google.com/download?id='+id+'&export=download';}
/* OPSIONAL tapi disarankan: isi dengan API key Google (Drive API v3) agar audio/video Drive
   diputar stabil di HP. Kosongkan = pakai link unduhan langsung (kurang stabil). */
const DRIVE_API_KEY='';
function driveFrame(id){
  return '<iframe src="'+drivePreview(id)+'" title="Media soal" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
}
async function initDrive(root){
  root.querySelectorAll('.drv').forEach(async box=>{
    const id=box.dataset.id,wantVideo=box.dataset.v==='1';
    let kind=wantVideo?'video':'audio',src=driveDirect(id);
    if(DRIVE_API_KEY){
      src='https://www.googleapis.com/drive/v3/files/'+id+'?alt=media&key='+DRIVE_API_KEY;
      try{
        const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?fields=mimeType&key='+DRIVE_API_KEY);
        const j=await r.json();kind=/^video\//.test(j.mimeType||'')?'video':'audio';
      }catch(e){}
    }
    const el=document.createElement(kind);
    el.controls=true;el.preload='auto';el.setAttribute('controlsList','nodownload');
    if(kind==='video')el.setAttribute('playsinline','');
    el.src=src;
    const fb=document.createElement('button');fb.type='button';fb.className='hint';
    fb.style.cssText='background:none;border:0;padding:0;margin:-6px 0 14px;text-decoration:underline;cursor:pointer;color:inherit';
    fb.textContent='Tidak bisa diputar? Gunakan pemutar Drive';
    const useFrame=()=>{box.innerHTML=driveFrame(id);};
    fb.onclick=useFrame;el.onerror=useFrame;
    box.innerHTML='';box.appendChild(el);box.appendChild(fb);
  });
}
function mediaKind(u){
  if(!u)return '';if(driveId(u))return 'drive';if(embedUrl(u))return 'embed';
  const p=String(u).split('?')[0].split('#')[0];
  return RX_VID.test(p)?'video':RX_AUD.test(p)?'audio':RX_IMG.test(p)?'image':RX_PDF.test(p)?'pdf':'media';
}
function mediaHtml(q,i){
  const u=esc(q.gambar),k=mediaKind(q.gambar);
  if(k==='drive'){const id=driveId(q.gambar);return '<div class="drv" data-id="'+id+'" data-v="'+(/#video\b/i.test(String(q.gambar))?1:0)+'"></div>';}
  if(k==='pdf')return '<a class="qpdf" href="'+u+'" target="_blank" rel="noopener"><span class="qi">📄</span><span><b>Buka File PDF Jobdesk Praktikum</b><small>Terbuka di tab baru. Setelah selesai membaca, kembali ke halaman ini untuk mengunggah hasil praktikmu.</small></span></a>';
  if(k==='embed')return '<iframe src="'+esc(embedUrl(q.gambar))+'" title="Video soal nomor '+(i+1)+'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  if(k==='audio')return '<audio src="'+u+'" controls preload="metadata" controlsList="nodownload" onerror="this.insertAdjacentHTML(\'afterend\',\'<p class=&quot;hint&quot;>Audio tidak dapat dimuat.</p>\');this.remove()"></audio>';
  if(k==='video'||k==='media')return '<video src="'+u+'" controls playsinline preload="metadata" controlsList="nodownload" onerror="this.insertAdjacentHTML(\'afterend\',\'<p class=&quot;hint&quot;>Video/audio tidak dapat dimuat.</p>\');this.remove()"></video>';
  return '<figure class="qimg"><img src="'+u+'" alt="Gambar soal nomor '+(i+1)+'" decoding="async" onerror="this.parentNode.classList.add(\'err\');this.remove()"></figure>';
}
function render(){
  const i=st.cur,q=Q[i],a=st.ans[i];
  const top='<div class="qh"><span class="qn">'+(i+1)+'</span><span class="pill">'+lbl(q)+'</span><span class="sc">'+q.skor+' poin</span></div><p class="qt">'+esc(q.teks)+'</p>';
  let h='';
  if(q.tipe==='pg')h+=(q.opsi||[]).map((o,j)=>'<button type="button" class="op'+(a===j?' on':'')+'" data-v="'+j+'"><b>'+'ABCD'.charAt(j)+'</b><span>'+esc(o)+'</span></button>').join('');
  else if(q.tipe==='bs')h+='<div class="bs"><button type="button" class="op'+(a===true?' on':'')+'" data-v="1">Benar</button><button type="button" class="op'+(a===false?' on':'')+'" data-v="0">Salah</button></div>';
  else if(q.tipe==='tts'){

    h+='<div class="cells">';for(let k=0;k<n;k++)h+='<input class="cell" data-k="'+k+'" maxlength="1" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Huruf '+(k+1)+'" value="'+esc(v.charAt(k).trim())+'">';
    h+='</div><p class="hint">'+n+' huruf · '+(q.arah==='menurun'?'menurun':'mendatar')+'</p>';

  /* Media soal (gambar / MP3 / video) berada di wadah sendiri #qmed dan hanya dibuat ulang saat pindah nomor,
     supaya pemutaran tidak terputus ketika siswa memilih jawaban. Semua diputar di halaman ini (tanpa tab baru). */
  const root=$('qc');

  $('qtop').innerHTML=top;
  if(mediaIdx!==i){$('qmed').innerHTML=q.gambar?mediaHtml(q,i):'';mediaIdx=i;initDrive($('qmed'));}
  $('qans').innerHTML=h;upd();

}
function upd(){
  const n=Q.length,d=Q.filter((_,i)=>answered(i)).length;
  $('pg').textContent=d+' dari '+n+' soal terjawab';
  $('ng').innerHTML=Q.map((_,i)=>'<button type="button" class="nb'+(answered(i)?' done':'')+(st.flag[i]?' flag':'')+(i===st.cur?' cur':'')+'" data-i="'+i+'" aria-label="Soal '+(i+1)+'">'+(i+1)+'</button>').join('');
  $('bP').disabled=st.cur===0;$('bF').classList.toggle('on',!!st.flag[st.cur]);
  $('bN').textContent=st.cur===n-1?'Selesai ✓':'Berikutnya ›';
}
function onClick(e){
  if(e.target.closest('.qpdf')){pickStart();return;}
  const pb=e.target.closest('[data-pr]');if(pb)return prClick(pb);
  const b=e.target.closest('.op');if(!b)return;
  const q=Q[st.cur],v=b.dataset.v,val=q.tipe==='bs'?v==='1':+v;
  if(st.ans[st.cur]===val)delete st.ans[st.cur];else st.ans[st.cur]=val;
  save();render();

function cells(){return Array.from($('qc').querySelectorAll('.cell'));}
function setTts(){st.ans[st.cur]=cells().map(c=>c.value||' ').join('');if(!st.ans[st.cur].trim())delete st.ans[st.cur];save();upd();}
function onInput(e){
  const c=e.target;
  if(c.classList.contains('cell')){
    c.value=letters(c.value).slice(-1);setTts();
    if(c.value&&c.nextElementSibling)c.nextElementSibling.focus();
  }else if(c.tagName==='TEXTAREA'){
    if(c.value.trim())st.ans[st.cur]=c.value;else delete st.ans[st.cur];
    $('cc').textContent=c.value.length+' karakter';save();upd();
  }
}
function onKey(e){
  const c=e.target;if(!c.classList.contains('cell'))return;
  if(e.key==='Backspace'&&!c.value&&c.previousElementSibling){c.previousElementSibling.focus();}
  else if(e.key==='ArrowLeft'&&c.previousElementSibling)c.previousElementSibling.focus();
  else if(e.key==='ArrowRight'&&c.nextElementSibling)c.nextElementSibling.focus();
}
function onPaste(e){
  const c=e.target;if(!c.classList.contains('cell'))return;
  e.preventDefault();
  const t=letters((e.clipboardData||window.clipboardData).getData('text')),cs=cells();
  for(let k=+c.dataset.k,j=0;k<cs.length&&j<t.length;k++,j++)cs[k].value=t[j];
  setTts();
}

/* ---------- Praktikum: foto / video sebagai jawaban ----------
   Berkas dipilih & disimpan sementara di browser. Upload ke folder Google Drive baru dilakukan saat tombol Kirim Jawaban ditekan
   (lewat Google Apps Script, lihat drive-upload.gs). Link file di Drive disimpan di hasil_asesmen.jawaban (kolom jawab: [{u,id,t,n,s}]). */
const DRIVE_UPLOAD_URL='https://script.google.com/macros/s/AKfycbweW4BqRMvfVTK2JIwF3OT4lAuIymTuKfIn_KPkZW93uJj_G4v5YEfXcurOtnxD-Rh-FA/exec'; /* https://script.google.com/macros/s/XXXX/exec */
const PR_MAX_FILES=5,PR_MAX_VIDEO=10*1024*1024,PR_MAX_IMG=2*1024*1024;
const loc={}; /* id berkas lokal -> {blob,url} (tidak disimpan di localStorage) */
const upl={},pending=new Set();
let fPr=null,prSeq=0,picking=false,pickTo=null;
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
/* Membuka kamera/galeri membuat halaman kehilangan fokus: jangan dihitung sebagai pelanggaran */
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&picking)pickEnd();});
window.addEventListener('focus',()=>{if(picking)pickEnd();});
const isPrak=()=>!!(P&&P.bentuk==='praktikum');
/* Toleransi (buka PDF jobdesk / kamera / galeri) hanya berlaku di paket bentuk praktikum; bentuk lain tetap dihitung pelanggaran */
function pickStart(){if(!isPrak())return;picking=true;clearTimeout(pickTo);pickTo=setTimeout(()=>{picking=false;},180000);}
function pickEnd(){clearTimeout(pickTo);pickTo=setTimeout(()=>{picking=false;if(lockOn&&lockFs&&!finished&&!busy&&!fsEl())showLock('Layar penuh perlu diaktifkan kembali',true);},1500);}
function prSrc(f){return f.local?(loc[f.id]&&loc[f.id].url)||'':f.u;}
function prCard(f,k){
  const src=prSrc(f);
  const m=!src?'<div class="sp"></div>':f.t==='video'?'<video src="'+esc(src)+'" controls playsinline preload="metadata"></video>':'<img src="'+esc(src)+'" alt="Hasil praktik '+(k+1)+'" loading="lazy">';
  return '<div class="pf">'+m+'<button type="button" class="rm" data-pr="rm" data-k="'+k+'" aria-label="Hapus berkas '+(k+1)+'">×</button><div class="pi"><b>'+esc(f.n||'berkas')+'</b>'+fmtSize(f.s||0)+'</div></div>';
}
function prHtml(i){
  const a=Array.isArray(st.ans[i])?st.ans[i]:[],u=upl[i]||[],full=a.length+u.filter(x=>!x.err).length>=PR_MAX_FILES;
  return '<button type="button" class="prz" data-pr="add"'+(full?' disabled':'')+'><span>📤 Pilih Foto / Video Praktik</span><small>Foto (JPG/PNG, maks '+fmtSize(PR_MAX_IMG)+') atau video (MP4/MOV/WEBM, maks '+fmtSize(PR_MAX_VIDEO)+') · maks '+PR_MAX_FILES+' berkas</small></button>'+
    '<div class="pfl">'+a.map(prCard).join('')+u.map(x=>x.err
      ?'<div class="pf up er"><div>⚠️ '+esc(x.n)+'<br>'+esc(x.err)+'<br><button type="button" class="bt" data-pr="dis" data-id="'+x.id+'">Tutup</button></div></div>'
      :'<div class="pf up"><div><div class="sp"></div>Memproses…<br>'+esc(x.n)+'</div></div>').join('')+'</div>'+
    '<p class="hint">'+a.length+' berkas dipilih. Berkas baru diunggah ke Google Drive saat kamu menekan Kirim Jawaban; sebelum itu masih bisa dihapus atau diganti. Jangan refresh/tutup halaman, karena berkas yang belum terkirim akan hilang.</p>';
}
function prDrop(f){if(f&&f.local&&loc[f.id]){try{URL.revokeObjectURL(loc[f.id].url);}catch(_){}delete loc[f.id];}}
function prClick(b){
  const act=b.dataset.pr,i=st.cur;
  if(act==='add'){pickStart();if(fPr){fPr.value='';fPr.click();}}
  else if(act==='rm'){
    const a=Array.isArray(st.ans[i])?st.ans[i]:[],f=a[+b.dataset.k];if(!f)return;
    a.splice(+b.dataset.k,1);if(a.length)st.ans[i]=a;else delete st.ans[i];
    prDrop(f);save();render();
  }else if(act==='dis'){upl[i]=(upl[i]||[]).filter(x=>String(x.id)!==b.dataset.id);render();}
}
function prCompress(f){
  return new Promise(res=>{
    if(f.size<=350*1024&&/^image\/(jpeg|png|webp)$/i.test(f.type)){res(null);return;}
    const url=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{
      try{
        const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.max(1,Math.round(im.naturalWidth*k)),h=Math.max(1,Math.round(im.naturalHeight*k));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        c.toBlob(b=>{URL.revokeObjectURL(url);res(b&&b.size<f.size?b:null);},'image/jpeg',.82);
      }catch(_){URL.revokeObjectURL(url);res(null);}
    };
    im.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    im.src=url;
  });
}
async function prStage(i,q,f,t,item){
  try{
    let blob=f,ext=((f.name||'').match(/\.([a-z0-9]{2,5})$/i)||[])[1]||(t==='video'?'mp4':'jpg'),ct=f.type||(t==='video'?'video/mp4':'image/jpeg');
    if(t==='image'){const c=await prCompress(f);if(c){blob=c;ext='jpg';ct='image/jpeg';}}
    const lim=t==='video'?PR_MAX_VIDEO:PR_MAX_IMG;
    if(blob.size>lim)throw new Error('Ukuran berkas terlalu besar (maks '+fmtSize(lim)+').');
    const id='L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    loc[id]={blob:blob,url:URL.createObjectURL(blob),ct:ct};
    const a=Array.isArray(st.ans[i])?st.ans[i]:[];
    a.push({local:1,id:id,t:t,n:f.name||('berkas.'+ext),s:blob.size});
    st.ans[i]=a;save();
    upl[i]=(upl[i]||[]).filter(x=>x.id!==item.id);
  }catch(e){item.err=(e&&e.message)||String(e);}
  if(busy||finished)return;
  if(st.cur===i)render();else upd();
}
/* kirim satu berkas lokal ke Google Drive lewat Apps Script; mengembalikan {id,url} */
function blobB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('Gagal membaca berkas.'));r.readAsDataURL(b);});}
async function driveUpload(f,q){
  if(!/^https:\/\/script\.google\.com\//.test(DRIVE_UPLOAD_URL))throw new Error('Alamat upload Google Drive belum diatur. Hubungi gurumu.');
  const L=loc[f.id];if(!L)throw new Error('Berkas "'+(f.n||'')+'" hilang dari browser. Pilih ulang berkasnya.');
  const sf=v=>String(v==null?'':v).replace(/[^\w\-. ]/g,'_').trim();
  const ext=((f.n||'').match(/\.([a-z0-9]{2,5})$/i)||[])[1]||(f.t==='video'?'mp4':'jpg');
  const name=[sf(ID.kelas),sf(ID.nama),sf(ID.nisn),'soal'+sf(q.nomor),Date.now().toString(36)].filter(Boolean).join('_')+'.'+ext.toLowerCase().replace(/[^a-z0-9]/g,'');
  const body=JSON.stringify({name:name,mime:L.ct||L.blob.type||'application/octet-stream',data:await blobB64(L.blob)});
  const r=await fetch(DRIVE_UPLOAD_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,redirect:'follow'});
  const j=await r.json().catch(()=>null);
  if(!j||!j.ok)throw new Error((j&&j.error)||'Upload ke Google Drive gagal.');
  return {id:j.id,url:j.url};
}
/* unggah semua berkas lokal sebelum jawaban disimpan; mengembalikan true jika semua sukses */
async function uploadAll(setMsg){
  const todo=[];
  Q.forEach((q,i)=>{if(q.tipe!=='praktikum')return;(Array.isArray(st.ans[i])?st.ans[i]:[]).forEach(f=>{if(f&&f.local)todo.push([i,q,f]);});});
  for(let n=0;n<todo.length;n++){
    const [i,q,f]=todo[n];
    setMsg('Mengunggah berkas '+(n+1)+' dari '+todo.length+' ke Google Drive…');
    const r=await driveUpload(f,q);
    const a=st.ans[i],k=a.indexOf(f);
    const nf={u:r.url,id:r.id,t:f.t,n:f.n,s:f.s};
    if(k>=0)a[k]=nf;
    prDrop(f);save();
  }
  return todo.length;
}
function prAdd(files){
  if(!files.length)return;
  const i=st.cur,q=Q[i],a=Array.isArray(st.ans[i])?st.ans[i]:[];
  upl[i]=upl[i]||[];
  const room=PR_MAX_FILES-a.length-upl[i].filter(x=>!x.err).length;
  if(room<=0){toast('Maksimal '+PR_MAX_FILES+' berkas untuk soal ini.');return;}
  if(files.length>room){toast('Hanya '+room+' berkas pertama yang dipilih (maks '+PR_MAX_FILES+' berkas).');files=files.slice(0,room);}
  files.forEach(f=>{
    const nm=f.name||'berkas';
    const t=/^video\//i.test(f.type)||RX_VID.test(nm)?'video':/^image\//i.test(f.type)||RX_IMG.test(nm)?'image':'';
    if(!t){toast('"'+nm+'" bukan foto atau video.');return;}
    if(t==='video'&&f.size>PR_MAX_VIDEO){toast('Video "'+nm+'" lebih dari '+fmtSize(PR_MAX_VIDEO)+'. Perpendek video atau turunkan resolusinya.');return;}
    const item={id:++prSeq,n:nm,err:''};
    upl[i].push(item);
    const p=prStage(i,q,f,t,item);pending.add(p);p.then(()=>pending.delete(p));
  });
  render();
}

function showWarn(){
  if(warned)return;warned=true;
  wmPrev=document.activeElement;
  $('wm').classList.add('show');
  $('wmB').focus({preventScroll:true});
  wmTo=setTimeout(hideWarn,10000);
}
function hideWarn(){
  clearTimeout(wmTo);
  const w=$('wm');if(!w.classList.contains('show'))return;
  w.classList.remove('show');
  if(wmPrev&&wmPrev.focus&&document.contains(wmPrev)){try{wmPrev.focus({preventScroll:true});}catch(_){}}
  wmPrev=null;
}
function tick(){
  if(busy||finished)return;
  const r=deadline-Date.now(),el=$('tm');
  if(r<=0){el.textContent='00:00';clearInterval(timer);hideWarn();timeUp=true;toast('Waktu habis. Jawaban dikirim otomatis.');submit();return;}
  const s=Math.floor(r/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=v=>String(v).padStart(2,'0');
  el.textContent=(h?h+':':'')+p(m)+':'+p(x);el.classList.toggle('warn',r<=300000);
  if(r<=60000){showWarn();$('wmN').textContent=Math.ceil(r/1000);$('wmP').style.strokeDashoffset=(301.6*(1-r/60000)).toFixed(1);}
}
function ask(){
  if(pending.size){toast('Masih ada berkas yang sedang diunggah. Tunggu sampai selesai.');return;}
  const k=Q.filter((_,i)=>!answered(i)).length,f=Object.keys(st.flag).filter(i=>st.flag[i]).length;
  let t='Kirim jawaban sekarang?';
  if(k)t='Masih ada '+k+' soal yang belum dijawab.\n'+t;
  if(f)t+='\n('+f+' soal masih ditandai ragu-ragu)';
  if(lockConfirm(t+'\nSetelah dikirim, jawaban tidak dapat diubah.'))submit();
}

/* ---------- Simpan nilai ke tabel nilai_kelas_<kelas> ---------- */
function tblCands(kelas){
  const k=String(kelas||'').trim(),snake=k.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  const c=[];[snake,snake.replace(/_/g,''),k.toLowerCase(),k.toLowerCase().replace(/\s+/g,'_'),k].forEach(v=>{v='nilai_kelas_'+v;if(c.indexOf(v)<0)c.push(v);});
  return c;
}
const noTable=e=>e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache|Could not find the table/i.test(e.message||''));
/* Mata pelajaran paket soal (nama kolom dicocokkan dari beberapa kemungkinan) */
const mkey=v=>String(v||'').trim().replace(/\s+/g,' ').toLowerCase();
const MAPEL_COL=/^(mapel|mata_?pelajaran|nama_?mapel|nama_?mata_?pelajaran|pelajaran)$/i;
function paketMapel(){
  for(const k of ['matapelajaran','mata_pelajaran','mapel','nama_mapel']){const v=P&&P[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return String(v).trim();}
  return '';
}
async function simpanKeNilaiKelas(nilai){
  const kat=String(P.kategori||'').toLowerCase().replace(/[^a-z]/g,''),ke=+P.ke||1;
  /* UH ke-N -> ulangan_harian_N ; UTS -> uts ; UAS -> uas (nama dicocokkan tanpa garis bawah/spasi/huruf besar) */
  const want=kat==='uh'?['ulanganharian'+ke]:ke===1?[kat]:[kat+ke,kat];
  const sid=String(sess.id);
  for(const t of tblCands(ID.kelas)){
    const r=await db.from(t).select('*').eq('siswa_id',sid);
    if(r.error){if(noTable(r.error))continue;throw r.error;}
    const rows=r.data||[];
    if(!rows.length)return {ok:false,msg:'Kamu belum terdaftar di tabel '+t+'.'};
    /* satu siswa bisa punya beberapa baris (satu per mata pelajaran): pilih baris sesuai mapel paket soal */
    const mapel=paketMapel(),mcolOf=x=>Object.keys(x).find(k=>MAPEL_COL.test(k));
    let row=null;
    if(mapel){
      row=rows.find(x=>{const c=mcolOf(x);return c&&mkey(x[c])===mkey(mapel);})||null;
      if(!row&&rows.length===1&&!(mcolOf(rows[0])&&String(rows[0][mcolOf(rows[0])]||'').trim()))row=rows[0]; /* data lama tanpa mapel */
      if(!row){
        /* siswa sudah punya baris untuk mapel lain: buat baris baru untuk mapel ini (satu baris per siswa per mapel) */
        const base=rows[0],mc0=mcolOf(base)||'matapelajaran',nr={};
        Object.keys(base).forEach(k=>{if(/^(siswa_id|nama_siswa|nisn|kelas|rombel)$/i.test(k))nr[k]=base[k];});
        nr[mc0]=mapel;
        const ins=await db.from(t).insert(nr).select('*');
        if(ins.error)return {ok:false,msg:'Baris mata pelajaran '+mapel+' belum ada di '+t+' dan gagal dibuat: '+ins.error.message+' (jalankan nilai_kelas_per_mapel.sql di Supabase).'};
        row=(ins.data&&ins.data[0])||null;
        if(!row)return {ok:false,msg:'Baris mata pelajaran '+mapel+' gagal dibuat di '+t+'.'};
      }
    }else{
      if(rows.length>1)return {ok:false,msg:'Paket soal belum diberi mata pelajaran, sedangkan kamu terdaftar di '+rows.length+' mata pelajaran.'};
      row=rows[0];
    }
    const mcol=mcolOf(row);
    const keys=Object.keys(row);
    const col=want.map(w=>keys.find(k=>norm(k)===w)).find(Boolean);
    if(!col)return {ok:false,msg:'Kolom '+(kat==='uh'?'ulangan_harian_'+ke:kat)+' tidak ada di tabel '+t+'.'};
    const payload={[col]:nilai};
    if(mcol&&mapel&&!String(row[mcol]||'').trim())payload[mcol]=mapel; /* baris lama tanpa mapel diberi nama mapel ini */
    let uq=db.from(t).update(payload).eq('siswa_id',sid);
    if(mcol&&row[mcol]!==null&&row[mcol]!==undefined)uq=uq.eq(mcol,row[mcol]);
    const u=await uq.select('siswa_id');
    if(u.error)throw u.error;
    if(!u.data||!u.data.length)return {ok:false,msg:'Penyimpanan ke '+t+' ditolak (cek policy update di Supabase).'};
    return {ok:true,tabel:t,kolom:col,mapel:mapel};
  }
  return {ok:false,msg:'Tabel nilai untuk kelas '+ID.kelas+' tidak ditemukan.'};
}

async function submit(){
  if(busy||finished)return;busy=true;clearInterval(timer);clearInterval(stopT);hideWarn();lockOff();
  app.innerHTML='<div class="card st"><h2>'+(stopped?'Ujian dihentikan pengawas':timeUp?'Waktu habis':lockOut?'Ujian dikunci':'Mengirim jawaban…')+'</h2><p>'+(stopped||timeUp||lockOut?'Jawaban yang sudah kamu isi sedang dikirim. Jangan tutup halaman ini.':'Jangan tutup halaman ini.')+'</p></div>';
  $('tm').hidden=true;document.querySelector('.bar')&&document.querySelector('.bar').remove();
  if(pending.size){await Promise.race([Promise.all(Array.from(pending)),new Promise(r=>setTimeout(r,60000))]);}
  try{
    await uploadAll(t=>{const p=app.querySelector('.st p');if(p)p.textContent=t+' Jangan tutup halaman ini.';});
  }catch(e){
    busy=false;
    app.innerHTML='<div class="card st"><h2>Gagal mengunggah berkas</h2><p>'+esc((e&&e.message)||String(e))+'</p><p class="hint">Berkas yang sudah terunggah tidak akan diunggah ulang.</p><button class="bt pri" id="rt" type="button">Coba kirim lagi</button></div>';
    $('rt').onclick=submit;return;
  }
  let skor=null,maks=0,essay=false,benar=0;
  try{
    const rk=await db.from('butir_soal').select('nomor,tipe,skor,kunci_pg,kunci_bs,jawaban').eq('paket_id',pid).range(0,999);
    if(rk.error)throw rk.error;
    const K={};rk.data.forEach(r=>K[r.nomor]=r);skor=0;
    Q.forEach((q,i)=>{
      const k=K[q.nomor]||{},a=st.ans[i];
      if(q.tipe==='essay'||q.tipe==='praktikum'){essay=true;return;}
      maks+=+q.skor||0;
      const ok=q.tipe==='pg'?a===k.kunci_pg:q.tipe==='bs'?a===k.kunci_bs:(letters(a).length>0&&letters(a)===letters(k.jawaban));
      if(ok){skor+=+q.skor||0;benar++;}
    });
  }catch(_){skor=null;essay=true;}
  const nilai=skor!==null&&maks>0?Math.round(skor/maks*1000)/10:null;
  const rec={soal_aktif_id:A.id,paket_id:pid,siswa_id:String(sess.id),nama:ID.nama||null,nisn:ID.nisn||null,kelas:ID.kelas||P.kelas,kategori:ID.kategori||null,
    jawaban:Q.map((q,i)=>({nomor:q.nomor,tipe:q.tipe,jawab:st.ans[i]===undefined?null:st.ans[i]})),
    skor_otomatis:skor,skor_maks:maks,nilai:nilai,perlu_koreksi:essay,pelanggaran:st.viol,
    mulai:new Date(st.mulai).toISOString(),dikirim:new Date().toISOString()};
  let saved=true,dup=false;
  const MP=paketMapel();
  let r=await db.from('hasil_asesmen').insert(MP?Object.assign({},rec,{matapelajaran:MP}):rec);
  /* kolom matapelajaran belum ada di hasil_asesmen: simpan tanpa kolom itu agar jawaban tidak hilang */
  if(r.error&&MP&&/matapelajaran/i.test(r.error.message||''))r=await db.from('hasil_asesmen').insert(rec);
  if(r.error){
    if(r.error.code==='23505'){dup=true;}
    else if(r.error.code==='42P01'||/does not exist|schema cache/i.test(r.error.message||'')){saved=false;}
    else{busy=false;app.innerHTML='<div class="card st"><h2>Gagal mengirim</h2><p>'+esc(r.error.message)+'</p><button class="bt pri" id="rt" type="button">Coba kirim lagi</button></div>';$('rt').onclick=submit;return;}
  }
  let nl=null;
  if(!dup&&nilai!==null){try{nl=await simpanKeNilaiKelas(nilai);}catch(e){nl={ok:false,msg:(e&&e.message)||String(e)};}}
  finished=true;
  {const d=new Date(),jm=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
   if(!stopped)ujSync((st.viol||0)>0?{jam_selesai:jm}:{status:'Selesai',jam_selesai:jm},(st.viol||0)>0?null:'mg');} /* ada pelanggaran: status tetap Pelanggaran */
  await Promise.race([ujP,new Promise(r=>setTimeout(r,3000))]);
  if(saved){try{localStorage.removeItem(KEY);}catch(_){}try{sessionStorage.removeItem('madani_asesmen');}catch(_){}}
  done({nilai:nilai,skor_otomatis:skor,skor_maks:maks,perlu_koreksi:essay},false,saved,nl);
}
function done(r,already,saved,nl){
  finished=true;lockOff();
  $('tm').hidden=true;const bar=document.querySelector('.bar');if(bar)bar.remove();
  const kor=P&&P.bentuk==='praktikum'?'Hasil praktikmu akan dinilai oleh gurumu.':'Soal uraian akan dinilai oleh gurumu.';
  let h='<div class="card st"><h2>'+(already?'Kamu sudah mengerjakan asesmen ini':'Jawaban terkirim ✓')+'</h2>';
  if(stopped&&!already)h+='<p style="color:var(--red);margin-bottom:6px">Ujianmu dihentikan oleh pengawas'+(stopKet?': '+esc(stopKet):'')+'. Jawaban yang sudah kamu isi terkirim otomatis.</p>';
  else if(lockOut&&!already)h+='<p style="color:var(--red);margin-bottom:6px">Ujian dikunci karena pelanggaran mencapai batas ('+LOCK.MAX+'x). Jawaban terkirim otomatis.</p>';
  if(SHOW_NILAI&&r.nilai!=null){
    h+='<div class="big">'+r.nilai+'</div><p>Skor '+r.skor_otomatis+' dari '+r.skor_maks+(P&&P.kkm!=null?' · KKM '+P.kkm:'')+'</p>';
    if(r.perlu_koreksi)h+='<p style="margin-top:6px">Nilai sementara. '+kor+'</p>';
  }else if(r.perlu_koreksi)h+='<p>'+kor+'</p>';
  else h+='<p>Terima kasih. Hasilmu akan disampaikan oleh gurumu.</p>';
  if(saved===false)h+='<p style="color:var(--red);margin-top:10px">Tabel hasil_asesmen (atau kolom nisn/kategori) belum ada di Supabase, jadi jawaban belum tersimpan di server. Jangan hapus data browser dan hubungi gurumu.</p>';
  if(nl&&!nl.ok)h+='<p style="color:var(--red);margin-top:10px">Jawabanmu sudah terkirim, tetapi nilai belum masuk ke tabel nilai kelas: '+esc(nl.msg)+' Hubungi gurumu.</p>';
  app.innerHTML=h+'<a class="bt pri" href="'+BACK+'">Kembali ke Asesmen</a></div>';
}
init();
})();
