<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asesmen — MADANI</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --text:#0f2a1d;--muted:#58705f;--accent:#12a05f;--green:#28c840;--orange:#ff9f0a;--red:#ff453a;--purple:#af52de;
  --glass:rgba(255,255,255,.72);--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.1);--bar:rgba(255,255,255,.6);--track:rgba(120,120,128,.16);
  --wall:linear-gradient(135deg,#9fe3bf 0%,#c4eed6 38%,#e6f4c8 70%,#f7e8b0 100%);
  --shadow:0 14px 40px rgba(30,30,80,.2),0 0 0 .5px rgba(0,0,0,.14);
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--wall) fixed;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 20px;padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;min-width:0}
.sch-logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;overflow:hidden;
  background:#04150d;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.22)}
.sch-logo svg{width:20px;height:20px}
.sch-logo img{width:100%;height:100%;object-fit:contain}
.sch-logo[hidden]{display:none}
.sch-name{display:block;min-width:0;line-height:1.2}
.sch-name b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-name small{display:block;font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.sch-name small{display:none}.sch-name b{font-size:13px}}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-radius:99px;background:var(--track)}
.acct div{text-align:right;line-height:1.2}
.acct b{display:block;font-size:13px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{font-size:11px;color:var(--muted)}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(160deg,#2fd283,#0b7a47);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* Layout */
.wrap{max-width:none;margin:0;padding:22px min(150px,12vw)}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:18px}
h1{font-size:clamp(26px,4.5vw,36px);letter-spacing:-.025em;line-height:1.1}
.head p{color:var(--muted);font-size:14px;margin-top:4px}
.chip{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;background:var(--glass);box-shadow:0 0 0 .5px var(--line)}
.panel{background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:16px;box-shadow:var(--shadow)}

.box{padding:20px}
.box h2{font-size:18px;letter-spacing:-.01em}
.box .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Sticky footer dock — gaya dock layar utama ponsel (melayang, kaca buram, ikon squircle) */
.dock{position:fixed!important;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}
html,body{overflow-x:hidden}
.dock nav{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:28px;padding:10px 22px;border-radius:34px;
  background:rgba(255,255,255,.34);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(20,60,40,.22),inset 0 1px 0 rgba(255,255,255,.6)}
.dock nav .d{display:grid;place-items:center;width:auto;padding:0;border-radius:15px;font-size:0;line-height:0;background:none;transition:transform .2s}
.dock nav .d:hover{background:none;transform:translateY(-6px) scale(1.1)}
.dock nav .d:active{transform:scale(.94)}
.dock nav .d .ic{width:56px;height:56px;border-radius:15px;box-shadow:0 3px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.dock nav .d .ic svg{width:28px;height:28px}
.dock nav .d{position:relative}
/* Tooltip nama menu (teks putih, latar hitam) */
.dock nav .d[data-tip]::after,.dock nav .d[data-tip]::before{position:absolute;left:50%;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .15s,transform .15s}
.dock nav .d[data-tip]::after{content:attr(data-tip);bottom:calc(100% + 12px);transform:translate(-50%,4px);padding:6px 11px;border-radius:8px;background:#000;color:#fff;font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.dock nav .d[data-tip]::before{content:"";bottom:calc(100% + 7px);transform:translate(-50%,4px);border-style:solid;border-width:5px 5px 0;border-color:#000 transparent transparent}
.dock nav .d[data-tip]:focus-visible::after,.dock nav .d[data-tip]:focus-visible::before{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media (hover:hover){.dock nav .d[data-tip]:hover::after,.dock nav .d[data-tip]:hover::before{opacity:1;visibility:visible;transform:translate(-50%,0)}}
@media (max-width:520px){.dock nav{gap:22px;padding:9px 18px;border-radius:30px}.dock nav .d .ic{width:50px;height:50px;border-radius:14px}.dock nav .d .ic svg{width:25px;height:25px}}
.d{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;width:92px;padding:8px 6px;border-radius:16px;font-size:12px;font-weight:600;line-height:1.2;text-align:center;transition:background .15s,transform .15s}
.d:hover{background:var(--track);transform:translateY(-3px)}
.d .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.d .ic svg{width:21px;height:21px}


@media (max-width:520px){.acct div{display:none}.acct{padding:3px}.d{width:62px;padding:6px 2px;font-size:10.5px}.d .ic{width:36px;height:36px}.wrap{padding:16px 5px}.nav{padding-left:5px;padding-right:5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Bottom sheet (slide up) */
.sheet-bd{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility 0s linear .34s}
.sheet-bd.open{opacity:1;visibility:visible;transition:opacity .28s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;width:min(720px,100%);margin:0 auto;border-radius:22px 22px 0 0;
  background:rgba(255,255,255,.45);backdrop-filter:saturate(180%) blur(40px);-webkit-backdrop-filter:saturate(180%) blur(40px);
  box-shadow:0 -10px 40px rgba(30,30,80,.25),0 0 0 .5px rgba(0,0,0,.14);padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .34s cubic-bezier(.2,.9,.3,1),visibility 0s linear .34s;max-height:85vh;overflow-y:auto}
.sheet.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:99px;background:rgba(120,120,128,.35);margin:0 auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h h2{font-size:20px;letter-spacing:-.01em}
.sheet-x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--track);color:var(--muted)}
.sheet-x svg{width:16px;height:16px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet-grid .d{width:auto;padding:14px 8px;background:var(--card);box-shadow:0 0 0 .5px var(--line);font-size:13px}
.sheet-grid .d:hover{background:#E0F8C7}
body.lock{overflow:hidden}
@media (max-width:520px){.sheet-grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-bd{transition:none!important}}
/* Dock: Menu + Logout, dengan nama tombol */
.dock nav{align-items:flex-start;gap:28px;padding:10px 22px}
.dock nav .d{display:flex;flex-direction:column;align-items:center;gap:5px;width:auto;min-width:64px;padding:4px 6px;font-size:11.5px;font-weight:600;line-height:1.2;color:var(--text)}
.dock nav .d .ic{width:52px;height:52px}
.dock nav .d .ic svg{width:26px;height:26px}
.dock nav .d[data-tip]::after,.dock nav .d[data-tip]::before{display:none}
@media (max-width:640px){
  /* smartphone: jarak kiri-kanan halaman 5px */
  .wrap{padding:16px 5px}
  .nav{padding-left:5px;padding-right:5px}
  .dock{padding-left:5px;padding-right:5px}
  .dock nav{gap:22px;padding:8px 18px}
  .box{padding:14px}
  .sheet{padding-left:12px;padding-right:12px}
}
.state{padding:34px 10px;text-align:center;color:var(--muted)}
.state b{display:block;font-size:16px;color:var(--text);margin-bottom:4px}
.state .btn{display:inline-flex;margin-top:14px;padding:10px 20px;border-radius:12px;font-weight:700;color:#fff;background:linear-gradient(160deg,#2fd283,#0b7a47);box-shadow:0 4px 12px rgba(11,122,71,.35)}
/* Modal Upload Photo */
.mbd{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:mfade .18s ease}
.mbd[hidden]{display:none}
.mdl{width:min(440px,100%);max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;border-radius:20px;background:#f6fbf8;box-shadow:0 24px 70px rgba(0,0,0,.38),0 0 0 .5px rgba(0,0,0,.14);animation:mpop .22s cubic-bezier(.2,.9,.3,1);overflow:hidden}
.mh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:.5px solid var(--line);background:rgba(255,255,255,.7)}
.mh h2{font-size:19px;letter-spacing:-.01em}
.mx{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--track);color:var(--muted)}
.mx svg{width:16px;height:16px}
.mb{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 20px;text-align:center}
.mb .sub{font-size:13px;color:var(--muted);margin-bottom:14px;text-align:left}
.pvw{width:150px;height:200px;margin:0 auto 12px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:var(--track);box-shadow:inset 0 0 0 1px var(--line)}
.pvw img{width:100%;height:100%;object-fit:cover;display:block}
.pvw .nophoto{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;font-size:12px;font-weight:600;color:var(--muted)}
.pvw .nophoto svg{width:34px;height:34px;opacity:.7}
.fn{font-size:12.5px;color:var(--muted);margin-bottom:12px;overflow-wrap:anywhere}
.mf{flex:none;display:flex;justify-content:flex-end;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:.5px solid var(--line);background:rgba(255,255,255,.85)}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;transition:transform .15s,opacity .15s}
.bt.pri{color:#fff;background:linear-gradient(160deg,#2fd283,#0b7a47);box-shadow:0 4px 12px rgba(11,122,71,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.bt.sec{background:var(--track)}
.bt[disabled]{opacity:.55;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;max-width:min(92vw,420px);padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;color:#fff;background:#1d1d1fe6;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#0b7a47}.toast.err{background:#d12f26}
@keyframes mfade{from{opacity:0}to{opacity:1}}
@keyframes mpop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:640px){.mbd{padding:0;align-items:flex-end}.mdl{width:100%;border-radius:20px 20px 0 0}.mh,.mb,.mf{padding-left:14px;padding-right:14px}.toast{bottom:calc(96px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){.mbd,.mdl{animation:none}}
.sk{height:14px;border-radius:7px;background:var(--track);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (max-width:640px){.dl{grid-template-columns:1fr}.idh .pf{width:84px;height:112px;border-radius:14px}.idh h2{font-size:17px}.box{padding:16px}}

/* ===== Halaman Asesmen ===== */
.listhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.tools select,.tools input{font:inherit;color:var(--text);padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.tools select:focus,.tools input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(18,160,95,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.grid .empty{grid-column:1/-1;padding:34px 12px;text-align:center;color:var(--muted);border-radius:14px;background:var(--card);box-shadow:0 0 0 .5px var(--line)}
.mc{display:flex;flex-direction:column;border-radius:16px;background:var(--card);box-shadow:0 0 0 .5px var(--line);overflow:hidden;transition:transform .18s,box-shadow .18s}
.mc:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,60,40,.2),0 0 0 .5px var(--line)}
.thumb{position:relative;aspect-ratio:16/9;display:grid;place-items:center;color:#fff;overflow:hidden}
.thumb .ti svg{width:40px;height:40px;opacity:.9}
.badge,.cnt{position:absolute;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge{left:10px;top:10px}.cnt{right:10px;bottom:8px}
.stt{position:absolute;right:10px;top:10px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff}
.mc.off{filter:grayscale(1);opacity:.72}
.mc.off:hover{transform:none;box-shadow:0 0 0 .5px var(--line)}
.stt.off{background:rgba(60,60,60,.92)}
.stt.on{background:rgba(18,160,95,.95)}.stt.soon{background:rgba(29,78,216,.92)}.stt.end{background:rgba(88,112,95,.92)}
.mbd2{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;flex:1}
.mbd2 h3{font-size:15px;line-height:1.3;letter-spacing:-.01em}
.mbd2 p{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.g{background:rgba(18,160,95,.14);color:#0b7a47}.pill.b{background:rgba(47,125,246,.14);color:#1d4ed8}.pill.m{background:var(--track);color:var(--muted)}
.pill.mt{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sch{display:grid;gap:3px;margin-top:2px;font-size:12.5px;color:var(--muted)}
.sch b{color:var(--text);font-weight:700}
.go{display:flex;align-items:center;justify-content:center;width:100%;margin-top:auto;padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(160deg,#2fd283,#0b7a47);box-shadow:0 4px 12px rgba(11,122,71,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.go[disabled]{opacity:.5;pointer-events:none;background:var(--track);color:var(--muted);box-shadow:none}
.mbd2 .go{margin-top:8px}
.tin{width:100%;font:inherit;font-size:26px;font-weight:800;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(18,160,95,.2)}
.merr{min-height:18px;margin-top:8px;font-size:12.5px;font-weight:600;color:#d12f26;text-align:center}
@media (max-width:520px){.grid{grid-template-columns:1fr;gap:12px}.tools{width:100%}.tools select,.tools input{flex:1;min-width:0}}

.mdl.wide{width:min(680px,100%)}
.mb.rwb{text-align:left}
.rwsum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rwsum span{font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--track);color:var(--text)}
.rwi{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:10px;border-radius:14px;background:#fff;box-shadow:0 0 0 .5px var(--line)}
.rwi .inf{min-width:0;flex:1}
.rwi h3{font-size:14.5px;line-height:1.3;letter-spacing:-.01em;margin-bottom:5px}
.rwi .pills{margin-bottom:6px}
.rwi .tm{font-size:12px;color:var(--muted)}
.rwi .sc{flex:none;text-align:center;min-width:76px}
.rwi .sc b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.rwi .sc small{display:block;font-size:11.5px;color:var(--muted)}
.rwi .sc .pill{margin-top:5px}
.pill.r{background:rgba(239,68,68,.15);color:#c62828}.pill.o{background:rgba(245,158,11,.18);color:#b45309}
.rwe{padding:30px 10px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:640px){.mdl.wide{width:100%}}
</style>
</head>
<body>

<header class="nav">
  <div class="brand">
    <span class="sch-logo" id="navLogoBox" aria-hidden="true" hidden><img id="navLogo" alt=""></span>
    <span class="sch-name"><b id="navTitle">MADANI</b><small id="navSub">MGMP PAI Bangka Barat</small></span>
  </div>
  <span class="sp"></span>
  <div class="acct" aria-label="Akun masuk">
    <div><b id="acctName">Siswa</b><small id="acctRole">Siswa</small></div>
    <span class="avatar" id="acctAv">S</span>
  </div>
</header>

<main class="wrap">
  <section class="panel box" aria-labelledby="sTitle">
    <div class="listhead">
      <div>
        <h2 id="sTitle">Asesmen</h2>
        <div class="chips"><span class="chip" id="stKelas">Kelas —</span><span class="chip" id="stPaket">0 asesmen aktif</span></div>
      </div>
      <div class="tools">
        <select id="fKat" aria-label="Filter kategori">
          <option value="">Semua kategori</option><option value="UH">Ulangan Harian</option><option value="UTS">UTS</option><option value="UAS">UAS</option>
        </select>
        <input id="q" type="search" placeholder="Cari asesmen…" aria-label="Cari asesmen">
      </div>
    </div>
    <div class="grid" id="grid"><div class="empty">Memuat…</div></div>
  </section>
</main>

<!-- Sticky footer -->
<div class="dock">
  <nav aria-label="Menu utama">
    <a class="d" id="btnHome" data-tip="Beranda" aria-label="Beranda" href="adminsiswa.html"><span class="ic" style="background:linear-gradient(160deg,#2fd283,#0b7a47)" data-i="home"></span>Beranda</a>
    <button class="d" id="btnRiwayat" data-tip="Riwayat Asesmenku" aria-label="Riwayat Asesmenku" type="button" aria-haspopup="dialog"><span class="ic" style="background:linear-gradient(160deg,#60a5fa,#1d4ed8)" data-i="history"></span>Riwayat Asesmenku</button>
  </nav>
</div>

<!-- Modal token -->
<div class="mbd" id="tkBd" hidden>
  <div class="mdl" role="dialog" aria-modal="true" aria-labelledby="tkTitle">
    <div class="mh"><h2 id="tkTitle">Masukkan Token</h2><button type="button" class="mx" id="tkX" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <form id="tkForm" autocomplete="off" novalidate>
      <div class="mb">
        <p class="sub" id="tkSub"></p>
        <input class="tin" id="tkIn" maxlength="6" inputmode="text" autocapitalize="characters" spellcheck="false" aria-label="Token soal" placeholder="••••••">
        <div class="merr" id="tkErr" role="alert"></div>
      </div>
      <div class="mf"><button type="button" class="bt sec" id="tkCancel">Batal</button><button type="submit" class="bt pri" id="tkOk">Mulai</button></div>
    </form>
  </div>
</div>
<!-- Modal riwayat asesmenku -->
<div class="mbd" id="rwBd" hidden>
  <div class="mdl wide" role="dialog" aria-modal="true" aria-labelledby="rwTitle">
    <div class="mh"><h2 id="rwTitle">Riwayat Asesmenku</h2><button type="button" class="mx" id="rwX" aria-label="Tutup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="mb rwb">
      <div class="rwsum" id="rwSum"></div>
      <div id="rwList"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var P={
    home:'<path d="M3 11l9-7.5 9 7.5M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/>',
    grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
    media:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
    exam:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 14l2 2 4-4"/>',
    check:'<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3v3M15 3v3M8.5 13l2.5 2.5 4.5-5"/>',
    grad:'<path d="M2.5 9L12 4.5 21.5 9 12 13.5zM6 11.2V16c1.6 1.6 3.6 2.5 6 2.5s4.4-.9 6-2.5v-4.8M21.5 9v6"/>',
    history:'<path d="M3.5 12a8.5 8.5 0 102.6-6.1M3.5 4.5v4h4M12 7.5V12l3 2"/>',
    out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
    essay:'<path d="M4 6h16M4 11h9M4 16h6M14.5 19l.8-3 4.2-4.2 2.2 2.2L17.5 18.2z"/>',
    pg:'<path d="M4 7l1.8 1.8L9 5.5M4 17l1.8 1.8L9 15.5M13 7h7M13 17h7"/>',
    tts:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.5 3.5v17M14.5 3.5v17M3.5 9.5h17M3.5 14.5h17"/>',
    bs:'<path d="M3.5 8l2.5 2.5L10.5 5M13.5 14l6 6M19.5 14l-6 6"/>'
  };
  function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>';}
  document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=svg(e.dataset.i);});
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function initials(n){return String(n||'').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()||'S';}
  function norm(k){return String(k||'').toLowerCase().replace(/[\s\-_.]/g,'');}

  var tt;
  function toast(t,k){var e=$('toast');e.textContent=t;e.className='toast show '+(k||'');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('show');},3800);}
  function state(title,msg,btn){
    $('grid').innerHTML='<div class="empty"><b style="display:block;font-size:16px;color:var(--text);margin-bottom:4px">'+esc(title)+'</b>'+esc(msg)+(btn?'<br><a class="btn" style="display:inline-flex;margin-top:14px;padding:10px 20px;border-radius:12px;font-weight:700;color:#fff;background:linear-gradient(160deg,#2fd283,#0b7a47)" href="index.html">'+esc(btn)+'</a>':'')+'</div>';
  }

  /* ---------- Sesi siswa ---------- */
  var sess=null;
  try{sess=JSON.parse(sessionStorage.getItem('madani_session')||'null');}catch(_){}
  if(!sess||sess.role!=='siswa'||!sess.id){
    state('Belum login sebagai siswa','Silakan masuk lewat Ruang Siswa untuk melihat asesmen kelasmu.','Ke halaman login');
    return;
  }
  $('acctName').textContent=sess.nama||'Siswa';
  $('acctRole').textContent=sess.kelas||'Siswa';
  $('acctAv').textContent=initials(sess.nama);

  var SB_URL='https://vvlngdwghdhrrnpczier.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2bG5nZHdnaGRocnJucGN6aWVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDI1MzgsImV4cCI6MjEwNzk3ODUzOH0.kV3y6rUu0NKbV451dvD4SkeZRJtuLNzwoA81tUY8jiA';
  var db=window.supabase.createClient(SB_URL,SB_KEY);

  var KAT={UH:'Ulangan Harian',UTS:'UTS',UAS:'UAS'};
  var GRAD={essay:'linear-gradient(160deg,#fb923c,#c2410c)',pg:'linear-gradient(160deg,#2fd283,#0b7a47)',tts:'linear-gradient(160deg,#a78bfa,#6d28d9)',bs:'linear-gradient(160deg,#60a5fa,#1d4ed8)'};
  var BENTUK={essay:'Essay',pg:'Pilihan Ganda',tts:'Teka Teki Silang',bs:'Benar Salah'};
  var list=[],kelas='';

  function fmt(t){try{return new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(_){return String(t);}}
  function status(a){
    if(!a.aktif)return {k:'off',t:'Tidak aktif'};
    var n=Date.now(),m=new Date(a.mulai).getTime(),s=new Date(a.selesai).getTime();
    if(n<m)return {k:'soon',t:'Belum dimulai'};
    if(n>s)return {k:'end',t:'Sudah berakhir'};
    return {k:'on',t:'Berlangsung'};
  }
  function katLabel(p){var ke=+p.ke||1;return (KAT[p.kategori]||p.kategori||'')+(ke>1?' '+ke:'');}
  function card(a){
    var b=BENTUK[a.bentuk]?a.bentuk:'pg',st=status(a);
    var jadwal=a.aktif?
      '<div class="sch"><span>Waktu pengerjaan: <b>'+a.durasi+' menit</b></span><span>Mulai: <b>'+esc(fmt(a.mulai))+'</b></span><span>Selesai: <b>'+esc(fmt(a.selesai))+'</b></span></div>':
      '<div class="sch"><span>Belum diaktifkan oleh guru.</span></div>';
    return '<article class="mc'+(a.aktif?'':' off')+'">'+
      '<div class="thumb" style="background:'+GRAD[b]+'"><span class="ti">'+svg(b)+'</span><span class="badge">'+esc(BENTUK[b])+'</span><span class="stt '+st.k+'">'+st.t+'</span><span class="cnt">'+a.jumlah+' soal</span></div>'+
      '<div class="mbd2"><h3>'+esc(a.judul)+'</h3>'+(a.deskripsi?'<p>'+esc(a.deskripsi)+'</p>':'')+
      '<div class="pills"><span class="pill g">'+esc(a.kelas)+'</span><span class="pill b">'+esc(katLabel(a))+'</span>'+(a.materi?'<span class="pill m mt" title="'+esc(a.materi)+'">'+esc(a.materi)+'</span>':'')+'</div>'+
      jadwal+
      '<button type="button" class="go" data-id="'+(a.aid||'')+'"'+(st.k==='on'?'':' disabled')+'>'+(st.k==='on'?'Mulai Kerjakan':st.k==='off'?'Tidak aktif':st.k==='soon'?'Belum dibuka':'Waktu habis')+'</button>'+
      '</div></article>';
  }
  function render(){
    var q=$('q').value.trim().toLowerCase(),fk=$('fKat').value;
    var rows=list.filter(function(a){
      return (!fk||a.kategori===fk)&&(!q||a.judul.toLowerCase().indexOf(q)>-1||(a.deskripsi||'').toLowerCase().indexOf(q)>-1||(a.materi||'').toLowerCase().indexOf(q)>-1);
    });
    var nAkt=list.filter(function(a){return a.aktif;}).length;
    $('stPaket').textContent=nAkt+' aktif · '+list.length+' asesmen';
    $('grid').innerHTML=rows.length?rows.map(card).join(''):
      '<div class="empty">'+(list.length?'Tidak ada asesmen yang cocok.':'Belum ada asesmen untuk kelasmu.')+'</div>';
  }
  $('q').addEventListener('input',render);$('fKat').addEventListener('change',render);
  setInterval(function(){if(list.length&&$('tkBd').hidden)render();},30000);

  async function load(){
    try{
      kelas=sess.kelas||'';
      if(!kelas){
        var s=await db.from('siswa').select('rombel').eq('id',sess.id).maybeSingle();
        if(s.error)throw s.error;
        kelas=(s.data&&s.data.rombel)||'';
      }
      $('stKelas').textContent='Kelas '+(kelas||'—');
      $('acctRole').textContent=kelas||'Siswa';
      if(!kelas){state('Kelas belum tercatat','Data kelasmu belum ada. Hubungi guru.');return;}

      /* 1) Semua paket soal (dari halaman soal.html) milik kelas ini */
      var allp=[],from=0,step=1000;
      for(;;){
        var rp=await db.from('paket_soal').select('id,judul,kelas,materi,kategori,ke,bentuk,deskripsi').order('id',{ascending:false}).range(from,from+step-1);
        if(rp.error)throw rp.error;
        allp=allp.concat(rp.data||[]);
        if(!rp.data||rp.data.length<step)break;
        from+=step;
      }
      var pk={};allp.forEach(function(p){if(norm(p.kelas)===norm(kelas))pk[p.id]=p;});
      var mine=Object.keys(pk).map(Number);
      if(!mine.length){list=[];render();return;}

      /* 2) Status aktif dari tabel soal_aktif */
      var ra=await db.from('soal_aktif').select('id,paket_id,durasi_menit,mulai,selesai').eq('aktif',true).in('paket_id',mine).order('id',{ascending:false});
      if(ra.error)throw ra.error;
      var akt={};(ra.data||[]).forEach(function(r){if(!akt[r.paket_id])akt[r.paket_id]=r;});

      /* 3) Jumlah butir soal per paket */
      var cnt={};from=0;
      for(;;){
        var rb=await db.from('butir_soal').select('paket_id').in('paket_id',mine).range(from,from+step-1);
        if(rb.error)throw rb.error;
        (rb.data||[]).forEach(function(r){cnt[r.paket_id]=(cnt[r.paket_id]||0)+1;});
        if(!rb.data||rb.data.length<step)break;
        from+=step;
      }

      list=mine.map(function(id){
        var p=pk[id],a=akt[id];
        return {aid:a?a.id:null,pid:p.id,aktif:!!a,judul:p.judul,kelas:p.kelas,materi:p.materi||'',kategori:p.kategori,ke:p.ke,bentuk:p.bentuk,deskripsi:p.deskripsi||'',
          jumlah:cnt[p.id]||0,durasi:a?a.durasi_menit:null,mulai:a?a.mulai:null,selesai:a?a.selesai:null};
      }).sort(function(x,y){
        if(x.aktif!==y.aktif)return x.aktif?-1:1;
        if(x.aktif)return new Date(x.mulai)-new Date(y.mulai);
        return y.pid-x.pid;
      });
      render();
    }catch(e){
      var m=(e&&e.message)||String(e);
      if(e&&(e.code==='42P01'||/does not exist|schema cache/i.test(m)))m='Tabel asesmen belum tersedia. Hubungi guru.';
      else if(e&&/permission denied/i.test(m))m='Akses data ditolak. Hubungi guru.';
      state('Gagal memuat asesmen',m);
    }
  }
  load();

  /* ---------- Riwayat Asesmenku ---------- */
  var rwBusy=false;
  function fmtDur(sec){
    sec=+sec||0;if(sec<=0)return '—';
    if(sec<60)return sec+' dtk';
    var m=Math.floor(sec/60),d=sec%60;
    if(m<60)return m+' mnt'+(d?' '+d+' dtk':'');
    return Math.floor(m/60)+' j '+(m%60)+' mnt';
  }
  function fmtN(n){return (Math.round(n*10)/10).toString().replace('.',',');}
  function closeRw(){if($('rwBd').hidden)return;$('rwBd').hidden=true;document.body.classList.remove('lock');}
  async function openRw(){
    if(rwBusy)return;
    $('rwBd').hidden=false;document.body.classList.add('lock');
    $('rwSum').innerHTML='';$('rwList').innerHTML='<div class="rwe">Memuat riwayat…</div>';
    rwBusy=true;
    try{
      var rows=[],from=0,step=1000;
      for(;;){
        var r=await db.from('hasil_asesmen').select('soal_aktif_id,paket_id,kategori,nilai,skor_otomatis,skor_maks,perlu_koreksi,mulai,dikirim')
          .eq('siswa_id',String(sess.id)).order('dikirim',{ascending:false}).range(from,from+step-1);
        if(r.error)throw r.error;
        rows=rows.concat(r.data||[]);
        if(!r.data||r.data.length<step)break;
        from+=step;
      }
      if(!rows.length){$('rwList').innerHTML='<div class="rwe"><b style="display:block;font-size:16px;color:var(--text);margin-bottom:4px">Belum ada riwayat</b>Kamu belum mengerjakan asesmen apa pun.</div>';return;}
      var ids=[];rows.forEach(function(x){if(ids.indexOf(x.paket_id)<0)ids.push(x.paket_id);});
      var pk={};
      var rp=await db.from('paket_soal').select('id,judul,kelas,materi,kategori,ke,bentuk,kkm').in('id',ids);
      if(!rp.error)(rp.data||[]).forEach(function(p){pk[p.id]=p;});
      var sum=0,n=0;
      var html=rows.map(function(x){
        var p=pk[x.paket_id]||null,nilai=x.nilai===null||x.nilai===undefined?null:+x.nilai;
        if(nilai!==null){sum+=nilai;n++;}
        var kkm=p&&p.kkm!=null&&p.kkm!==''&&!isNaN(+p.kkm)?+p.kkm:null;
        var st;
        if(x.perlu_koreksi)st='<span class="pill o">Menunggu koreksi</span>';
        else if(nilai===null)st='';
        else if(kkm===null)st='';
        else st=nilai>=kkm?'<span class="pill g">Tuntas</span>':'<span class="pill r">Belum tuntas</span>';
        var dur=x.mulai&&x.dikirim?Math.round((new Date(x.dikirim)-new Date(x.mulai))/1000):0;
        var pills=p?'<div class="pills"><span class="pill b">'+esc(katLabel(p))+'</span>'+(BENTUK[p.bentuk]?'<span class="pill m">'+esc(BENTUK[p.bentuk])+'</span>':'')+(p.materi?'<span class="pill m mt" title="'+esc(p.materi)+'">'+esc(p.materi)+'</span>':'')+'</div>':'';
        return '<div class="rwi"><div class="inf"><h3>'+esc(p?p.judul:'Paket soal #'+x.paket_id)+'</h3>'+pills+
          '<div class="tm">Dikerjakan '+esc(fmt(x.dikirim))+' · Durasi '+esc(fmtDur(dur))+'</div></div>'+
          '<div class="sc"><b>'+(nilai===null?'—':fmtN(nilai))+'</b>'+((+x.skor_maks)>0?'<small>skor '+fmtN(+x.skor_otomatis||0)+'/'+fmtN(+x.skor_maks)+'</small>':'')+st+'</div></div>';
      }).join('');
      $('rwSum').innerHTML='<span>'+rows.length+' asesmen dikerjakan</span><span>Rata-rata nilai '+(n?fmtN(sum/n):'—')+'</span>';
      $('rwList').innerHTML=html;
    }catch(e){
      var m=(e&&e.message)||String(e);
      if(e&&(e.code==='42P01'||/does not exist|schema cache/i.test(m)))m='Tabel hasil_asesmen belum tersedia. Hubungi guru.';
      else if(e&&/permission denied/i.test(m))m='Akses data ditolak. Hubungi guru.';
      $('rwList').innerHTML='<div class="rwe"><b style="display:block;font-size:16px;color:var(--text);margin-bottom:4px">Gagal memuat riwayat</b>'+esc(m)+'</div>';
    }finally{rwBusy=false;}
  }
  $('btnRiwayat').addEventListener('click',openRw);
  $('rwX').addEventListener('click',closeRw);
  $('rwBd').addEventListener('mousedown',function(e){if(e.target===$('rwBd'))closeRw();});

  /* ---------- Token ---------- */
  var cur=null,tkBusy=false;
  function openTk(aid){
    cur=list.filter(function(x){return x.aid===aid;})[0];if(!cur)return;
    if(status(cur).k!=='on'){render();toast('Asesmen ini tidak sedang dibuka.','err');return;}
    $('tkSub').textContent=cur.judul+' · '+cur.durasi+' menit. Minta token ke gurumu.';
    $('tkIn').value='';$('tkErr').textContent='';
    $('tkBd').hidden=false;document.body.classList.add('lock');
    setTimeout(function(){$('tkIn').focus();},50);
  }
  function closeTk(){if(tkBusy||$('tkBd').hidden)return;$('tkBd').hidden=true;document.body.classList.remove('lock');cur=null;}
  $('grid').addEventListener('click',function(ev){var b=ev.target.closest('button.go');if(b&&!b.disabled)openTk(+b.dataset.id);});
  $('tkX').addEventListener('click',closeTk);$('tkCancel').addEventListener('click',closeTk);
  $('tkBd').addEventListener('mousedown',function(e){if(e.target===$('tkBd'))closeTk();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeTk();closeRw();}});
  $('tkIn').addEventListener('input',function(){this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');$('tkErr').textContent='';});
  /* ---------- Catat ke tabel ujian_berlangsung saat siswa menekan Mulai ---------- */
  function pad2(n){return (n<10?'0':'')+n;}
  function dStr(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
  function tStr(d){return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());}
  var skipRec=false; /* true setelah siswa diberi tahu pencatatan gagal; klik Mulai berikutnya tetap masuk ujian */
  async function catatUjian(selesaiIso){
    try{
      var sr=await db.from('siswa').select('nama,nisn,rombel').eq('id',sess.id).maybeSingle();
      var s=(sr&&sr.data)||{};
      var now=new Date(),end=new Date(now.getTime()+(+cur.durasi||0)*60000),lim=new Date(selesaiIso);
      if(!isNaN(lim.getTime())&&lim<end)end=lim; /* batas selesai tidak melewati penutupan asesmen */
      var ins=await db.from('ujian_berlangsung').insert({
        nama_siswa:String(s.nama||sess.nama||'').trim(),
        nisn:String(s.nisn||''),
        kelas:s.rombel||kelas||sess.kelas||'',
        jenis_ujian:katLabel(cur),
        tanggal:dStr(now),
        jam_mulai:tStr(now),
        jam_selesai:tStr(end),
        status:'Mengerjakan'
      }).select('id').single();
      if(ins.error)throw ins.error;
      return {id:ins.data.id};
    }catch(e){console.error('ujian_berlangsung:',e);return {id:null,err:(e&&(e.message||e.details))||String(e)};}
  }
  $('tkForm').addEventListener('submit',async function(ev){
    ev.preventDefault();if(tkBusy||!cur)return;
    var t=$('tkIn').value.trim();
    if(t.length<6){$('tkErr').textContent='Token terdiri dari 6 karakter.';return;}
    tkBusy=true;$('tkOk').disabled=true;$('tkOk').textContent='Memeriksa…';
    try{
      var r=await db.from('soal_aktif').select('id,selesai').eq('id',cur.aid).eq('token',t).eq('aktif',true).maybeSingle();
      if(r.error)throw r.error;
      if(!r.data){$('tkErr').textContent='Token salah. Periksa lagi.';}
      else if(Date.now()>new Date(r.data.selesai).getTime()){$('tkErr').textContent='Waktu asesmen sudah berakhir.';}
      else{
        var rec=await catatUjian(r.data.selesai);
        if(rec.err&&!skipRec){
          skipRec=true;
          $('tkErr').textContent='Data ujian gagal tercatat: '+rec.err+'. Laporkan ke guru, atau tekan Mulai sekali lagi untuk tetap masuk ujian.';
          tkBusy=false;$('tkOk').disabled=false;$('tkOk').textContent='Mulai';return;
        }
        var ujianId=rec.id;
        try{sessionStorage.setItem('madani_asesmen',JSON.stringify({soal_aktif_id:cur.aid,paket_id:cur.pid,durasi:cur.durasi,selesai:r.data.selesai,ujian_id:ujianId,t:Date.now()}));}catch(_){}
        tkBusy=false;
        location.href='kerjakan.html?paket='+encodeURIComponent(cur.pid);
        return;
      }
    }catch(e){$('tkErr').textContent='Gagal memeriksa token: '+((e&&e.message)||e);}
    tkBusy=false;$('tkOk').disabled=false;$('tkOk').textContent='Mulai';
  });

  (async function(){
    try{
      var r=await db.from('profil').select('nama_sekolah,logo_url').order('id',{ascending:true}).limit(1).maybeSingle();
      if(r.data&&r.data.nama_sekolah)$('navTitle').textContent=r.data.nama_sekolah;
      if(r.data&&r.data.logo_url){$('navLogo').src=r.data.logo_url;$('navLogoBox').hidden=false;}
    }catch(_){}
  })();
